[project]
name = "oninelabs"
version = "0.1.0"
description = "0nine Labs: a family of small byte-level models with different architectures"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["oninelabs", "oninelabs.models"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
