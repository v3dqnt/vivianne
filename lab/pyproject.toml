[project]
name = "vivlab"
version = "0.1.0"
description = "Vivianne Lab: a family of small byte-level models with different architectures"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["vivlab", "vivlab.models"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
