<template id="s1-intro-template">
  <div data-composition-id="s1-intro" data-width="1920" data-height="1080" data-duration="7"
       data-composition-variables='[{"id":"hasFootage","type":"boolean","label":"Has footage","default":false}]'>
    <!-- Placeholder city: shown until assets/footage/city.mp4 exists. -->
    <div class="city">
      <div class="sky"></div>
      <div class="glow"></div>
      <div class="layer far"></div>
      <div class="layer mid"></div>
      <div class="road"><div class="trails"></div></div>
      <div class="layer near"></div>
    </div>
    <div class="shade"></div>
    <div class="title">
      <div class="eyebrow">Introducing</div>
      <div class="wordmark"><img class="logo" src="assets/brand/vivianne-logo.svg" alt="" /><span class="name">Vivianne</span></div>
    </div>
    <style>
      [data-composition-id="s1-intro"] { overflow: hidden; }
      [data-composition-id="s1-intro"] .city, [data-composition-id="s1-intro"] .city > div { position: absolute; inset: 0; }
      [data-composition-id="s1-intro"] .city { transform-origin: 50% 70%; }
      [data-composition-id="s1-intro"] .sky { background: linear-gradient(180deg, #05070d 0%, #0b1020 45%, #1b1730 75%, #2a1a26 100%); }
      [data-composition-id="s1-intro"] .glow { background: radial-gradient(60% 35% at 50% 78%, rgba(255, 150, 80, 0.28), transparent 70%); }
      [data-composition-id="s1-intro"] .layer .b { position: absolute; bottom: 0; background-color: var(--c); background-image: radial-gradient(circle, var(--w2) 0 1.8px, transparent 2.2px), radial-gradient(circle, var(--w) 0 1.6px, transparent 2px); background-size: calc(var(--gx) * 3) calc(var(--gy) * 2), var(--gx) var(--gy); background-position: calc(6px + var(--gx)) 10px, 6px 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
      [data-composition-id="s1-intro"] .far { filter: blur(1.5px); opacity: 0.75; }
      [data-composition-id="s1-intro"] .mid { filter: blur(0.6px); }
      [data-composition-id="s1-intro"] .city > .road { top: auto; height: 210px; bottom: 0; background: linear-gradient(180deg, #0b0b12, #050508); }
      [data-composition-id="s1-intro"] .trails { position: absolute; inset: 0; }
      [data-composition-id="s1-intro"] .trail { position: absolute; height: 4px; border-radius: 4px; filter: blur(1.2px); box-shadow: 0 0 14px currentColor; }
      [data-composition-id="s1-intro"] .shade { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 35%, rgba(0, 0, 0, 0.75) 100%), linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.55)); }
      [data-composition-id="s1-intro"] .title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; color: #fff; }
      [data-composition-id="s1-intro"] .eyebrow { font: 500 34px/1 var(--font-display); letter-spacing: 0.32em; text-transform: uppercase; opacity: 0.85; }
      [data-composition-id="s1-intro"] .wordmark { display: flex; align-items: center; gap: 34px; }
      [data-composition-id="s1-intro"] .logo { width: 150px; height: 150px; filter: brightness(0) invert(1); }
      [data-composition-id="s1-intro"] .name { font: 500 168px/1 var(--font-display); letter-spacing: -0.04em; }
    </style>
    <script>
      (() => {
        const root = document.querySelector('[data-composition-id="s1-intro"]');
        const { hasFootage } = window.__hyperframes.getVariables();
        const $ = (s) => root.querySelector(s);
        const rand = HF.rng(7);
        if (hasFootage) $('.city').style.display = 'none';

        // Skyline: three layers of buildings, lit windows, all from a seeded PRNG.
        const layers = [
          { el: $('.far'), h: [220, 520], c: '#0d1222', a: 0.35, bottom: 200 },
          { el: $('.mid'), h: [260, 600], c: '#0a0d18', a: 0.5, bottom: 190 },
          { el: $('.near'), h: [300, 640], c: '#05060b', a: 0.65, bottom: 170 },
        ];
        for (const L of layers) {
          let x = -80;
          while (x < 2000) {
            const w = 60 + rand() * (L === layers[2] ? 260 : 140);
            const h = L.h[0] + rand() * (L.h[1] - L.h[0]);
            const b = document.createElement('div');
            b.className = 'b';
            b.style.cssText = `left:${x}px;width:${w}px;height:${h}px;bottom:${L.bottom}px;--c:${L.c};--w:rgba(255,214,150,${(L.a * (0.15 + rand() * 0.6)).toFixed(3)});--w2:rgba(255,236,190,${(rand() < 0.6 ? L.a + 0.25 : 0).toFixed(3)});--gx:${14 + Math.round(rand() * 8)}px;--gy:${20 + Math.round(rand() * 10)}px`;
            L.el.appendChild(b);
            x += w + rand() * 18;
          }
        }
        // Traffic: head- and tail-light streaks crossing the road.
        const trails = $('.trails');
        const streaks = [];
        for (let i = 0; i < 70; i++) {
          const red = i % 2 === 0;
          const t = document.createElement('div');
          t.className = 'trail';
          const len = 180 + rand() * 420;
          t.style.cssText = `top:${30 + rand() * 150}px;width:${len}px;background:linear-gradient(90deg, transparent, ${red ? 'rgba(255,60,60,0.9)' : 'rgba(255,240,200,0.95)'}, transparent)`;
          trails.appendChild(t);
          streaks.push({ t, red, len, delay: rand() * 2, speed: 0.7 + rand() * 1.1 });
        }

        const tl = gsap.timeline({ paused: true });
        // Slow push-in on the city, layers at different depths.
        tl.fromTo($('.city'), { scale: 1.0 }, { scale: 1.12, duration: 7, ease: 'none' }, 0);
        tl.fromTo($('.far'), { x: 0 }, { x: -30, duration: 7, ease: 'none' }, 0);
        tl.fromTo($('.near'), { x: 0 }, { x: -90, duration: 7, ease: 'none' }, 0);
        for (const s of streaks) {
          const from = s.red ? 1980 : -s.len, to = s.red ? -s.len : 1980;
          // Back-to-back passes from t=0; the first starts part-way across.
          for (let t = -s.delay; t < 7; t += s.speed + 0.4) {
            const start = Math.max(0, t), done = (start - t) / s.speed;
            if (done >= 1) continue;
            tl.fromTo(s.t, { x: from + (to - from) * done }, { x: to, duration: s.speed * (1 - done), ease: 'none', immediateRender: false }, start);
          }
        }
        // Title: eyebrow, then the wordmark sharpens in; out before the cut.
        tl.fromTo($('.eyebrow'), { opacity: 0, y: 14, filter: 'blur(10px)' }, { opacity: 0.85, y: 0, filter: 'blur(0px)', duration: 0.9, ease: 'power3.out' }, 1.0);
        tl.fromTo($('.logo'), { opacity: 0, scale: 0.7, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 1.1, ease: 'power3.out' }, 1.6);
        tl.fromTo($('.name'), { opacity: 0, x: -30, filter: 'blur(16px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 1.4, ease: 'power3.out' }, 1.8);
        tl.to($('.title'), { scale: 1.04, duration: 3.5, ease: 'none' }, 2.8);
        tl.to($('.title'), { opacity: 0, filter: 'blur(12px)', duration: 0.5, ease: 'power2.in' }, 6.1);
        window.__timelines = window.__timelines || {};
        window.__timelines["s1-intro"] = tl;
      })();
    </script>
  </div>
</template>
