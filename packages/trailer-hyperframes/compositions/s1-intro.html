<template id="s1-intro-template">
  <div data-composition-id="s1-intro" data-width="1920" data-height="1080" data-duration="7"
       data-composition-variables='[{"id":"hasFootage","type":"boolean","label":"Has footage","default":false},{"id":"duration","type":"number","label":"Duration","default":7}]'>
    <!-- Placeholder slate until assets/footage/city.mp4 exists. -->
    <div class="slate">
      <div class="slate-label">B-ROLL · busy city</div>
      <div class="slate-path">assets/footage/city.mp4</div>
    </div>
    <div class="shade"></div>
    <div class="title">
      <div class="eyebrow">Introducing</div>
      <div class="wordmark"><img class="logo" src="assets/brand/vivianne-logo.svg" alt="" /><span class="name">Vivianne</span></div>
    </div>
    <style>
      [data-composition-id="s1-intro"] { overflow: hidden; }
      [data-composition-id="s1-intro"] .slate { position: absolute; inset: 40px; border: 2px dashed rgba(255, 255, 255, 0.18); border-radius: 24px; background: #0c0c0e; display: flex; flex-direction: column; justify-content: flex-end; padding: 36px 44px; gap: 6px; }
      [data-composition-id="s1-intro"] .slate-label { font: 500 26px/1 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.45); }
      [data-composition-id="s1-intro"] .slate-path { font: 400 20px/1 var(--font-mono); color: rgba(255, 255, 255, 0.3); }
      [data-composition-id="s1-intro"] .shade { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(0, 0, 0, 0.6) 100%); }
      [data-composition-id="s1-intro"] .title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; color: #fff; }
      [data-composition-id="s1-intro"] .eyebrow { font: 500 34px/1 var(--font-display); letter-spacing: 0.32em; text-transform: uppercase; opacity: 0.85; }
      [data-composition-id="s1-intro"] .wordmark { display: flex; align-items: center; gap: 34px; }
      [data-composition-id="s1-intro"] .logo { width: 150px; height: 150px; filter: brightness(0) invert(1); }
      [data-composition-id="s1-intro"] .name { font: 500 168px/1 var(--font-display); letter-spacing: -0.04em; }
    </style>
    <script>
      (() => {
        const root = document.querySelector('[data-composition-id="s1-intro"]');
        const $ = (s) => root.querySelector(s);
        const { hasFootage } = window.__hyperframes.getVariables();
        if (hasFootage) $('.slate').style.display = 'none';

        const tl = gsap.timeline({ paused: true });
        tl.fromTo($('.eyebrow'), { opacity: 0, y: 14, filter: 'blur(10px)' }, { opacity: 0.85, y: 0, filter: 'blur(0px)', duration: 0.9, ease: 'power3.out' }, 1.0);
        tl.fromTo($('.logo'), { opacity: 0, scale: 0.7, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 1.1, ease: 'power3.out' }, 1.6);
        tl.fromTo($('.name'), { opacity: 0, x: -30, filter: 'blur(16px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 1.4, ease: 'power3.out' }, 1.8);
        tl.fromTo($('.title'), { scale: 1 }, { scale: 1.04, duration: 3.5, ease: 'none' }, 2.8);
        tl.to($('.title'), { opacity: 0, filter: 'blur(12px)', duration: 0.5, ease: 'power2.in' }, 6.1);
        window.__timelines = window.__timelines || {};
        window.__timelines["s1-intro"] = tl;
      })();
    </script>
  </div>
</template>
