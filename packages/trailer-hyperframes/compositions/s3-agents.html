<template id="s3-agents-template">
  <div data-composition-id="s3-agents" data-width="1920" data-height="1080" data-duration="17">
    <div class="app-stage"></div>
    <script>
      (() => {
        const root = document.querySelector('[data-composition-id="s3-agents"]');
        HF.mount(root.querySelector('.app-stage'), 'chrome-home');
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(root.querySelector('.app-stage'), { opacity: 0.6 }, { opacity: 1, duration: 1 }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["s3-agents"] = tl;
      })();
    </script>
  </div>
</template>
