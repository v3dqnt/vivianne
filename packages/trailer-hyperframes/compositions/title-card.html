<template id="title-card-template">
  <div data-composition-id="title-card" data-width="1920" data-height="1080" data-duration="4"
       data-composition-variables='[{"id":"line","type":"string","label":"Line","default":"Title"},{"id":"hasFootage","type":"boolean","label":"Has footage","default":false}]'>
    <div class="stub"></div>
    <style>
      [data-composition-id="title-card"] .stub { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font: 600 64px sans-serif; }
    </style>
    <script>
      (() => {
        const { line } = window.__hyperframes.getVariables();
        document.querySelectorAll('[data-composition-id="title-card"] .stub').forEach((el) => (el.textContent = line));
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["title-card"] = tl;
      })();
    </script>
  </div>
</template>
