<template id="s2-laptop-template">
  <div data-composition-id="s2-laptop" data-width="1920" data-height="1080" data-duration="6"
       data-composition-variables='[{"id":"hasFootage","type":"boolean","label":"Has footage","default":false},{"id":"screen","type":"string","label":"Screen capture","default":"chrome-home"},{"id":"duration","type":"number","label":"Duration","default":6}]'>
    <!-- Placeholder slate until assets/footage/laptop.mp4 exists. -->
    <div class="slate">
      <div class="slate-label">SHOT · he opens his laptop</div>
      <div class="slate-path">assets/footage/laptop.mp4</div>
    </div>
    <!-- Into the screen: the full-size app, identical to the next scene's first frame. -->
    <div class="full app-layer"><div class="app-stage"></div></div>
    <style>
      [data-composition-id="s2-laptop"] { overflow: hidden; }
      [data-composition-id="s2-laptop"] .slate { position: absolute; inset: 40px; border: 2px dashed rgba(255, 255, 255, 0.18); border-radius: 24px; background: #0c0c0e; display: flex; flex-direction: column; justify-content: flex-end; padding: 36px 44px; gap: 6px; }
      [data-composition-id="s2-laptop"] .slate-label { font: 500 26px/1 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.45); }
      [data-composition-id="s2-laptop"] .slate-path { font: 400 20px/1 var(--font-mono); color: rgba(255, 255, 255, 0.3); }
      [data-composition-id="s2-laptop"] .full { opacity: 0; }
    </style>
    <script>
      (() => {
        const root = document.querySelector('[data-composition-id="s2-laptop"]');
        const $ = (s) => root.querySelector(s);
        const { hasFootage, screen } = window.__hyperframes.getVariables();
        HF.mount($('.full .app-stage'), screen);
        if (hasFootage) $('.slate').style.display = 'none';

        // The camera goes into the laptop: the app frame zooms up out of the shot.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo($('.full'), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 1.8, ease: 'power3.inOut', transformOrigin: '50% 50%' }, 3.6);
        window.__timelines = window.__timelines || {};
        window.__timelines["s2-laptop"] = tl;
      })();
    </script>
  </div>
</template>
