<template id="s7-multiplayer-template">
  <div data-composition-id="s7-multiplayer" data-width="1920" data-height="1080" data-duration="14">
    <!-- Captured states (captures/multiplayer.js) plus one overlay: the
         invites crossing in a plain, unbranded messages card. -->
    <div class="cam">
      <div class="app-stage st" data-state="mp-0"></div>
      <div class="app-stage st" data-state="mp-new"></div>
      <div class="app-stage st" data-state="mp-pair"></div>
      <div class="app-stage st" data-state="mp-copied"></div>
      <div class="app-stage st" data-state="mp-pasted"></div>
      <div class="app-stage st" data-state="mp-live"></div>
      <div class="app-stage st" data-state="mp-typing"></div>
      <div class="app-stage st" data-state="mp-both"></div>
      <div class="app-stage pointer-layer">
        <div class="cursor">
          <svg viewBox="0 0 22 22"><path d="M3 2l14.5 9.2-6.4 1.3 3.7 7.1-2.6 1.3-3.7-7.2L3.6 18z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>
          <div class="cursor-ring"></div>
        </div>
      </div>
    </div>
    <div class="dim"></div>
    <div class="msgs">
      <div class="msgs-head"><span class="av">L</span><span class="who"></span></div>
      <div class="b me b1"><span class="say"></span><code class="code me-code"></code></div>
      <div class="b them b2"><span class="say">here's mine</span><code class="code them-code"></code></div>
    </div>
    <style>
      [data-composition-id="s7-multiplayer"] { overflow: hidden; background: var(--frame); }
      [data-composition-id="s7-multiplayer"] .cam { position: absolute; inset: 0; transform-origin: 0 0; }
      /* display, not visibility: dockview panes force visibility:visible on themselves. */
      [data-composition-id="s7-multiplayer"] .st { display: none; }
      [data-composition-id="s7-multiplayer"] .st[data-state="mp-0"] { display: block; }
      [data-composition-id="s7-multiplayer"] .pointer-layer { pointer-events: none; overflow: visible; z-index: 5; }
      [data-composition-id="s7-multiplayer"] .dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55); opacity: 0; }
      [data-composition-id="s7-multiplayer"] .msgs { position: absolute; left: 50%; top: 50%; width: 640px; margin: -230px 0 0 -320px; padding: 22px; border-radius: 28px; background: #1c1c1e; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6); font: 400 22px/1.4 var(--font-ui); color: #f2f2f2; opacity: 0; }
      [data-composition-id="s7-multiplayer"] .msgs-head { display: flex; align-items: center; gap: 12px; padding: 0 4px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 18px; font-weight: 500; }
      [data-composition-id="s7-multiplayer"] .av { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #2f4f3f; color: #a6e3bf; font-size: 18px; }
      [data-composition-id="s7-multiplayer"] .b { max-width: 82%; padding: 12px 16px; border-radius: 22px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
      [data-composition-id="s7-multiplayer"] .me { margin-left: auto; background: #3a6df0; border-bottom-right-radius: 6px; }
      [data-composition-id="s7-multiplayer"] .them { background: #2c2c2e; border-bottom-left-radius: 6px; }
      [data-composition-id="s7-multiplayer"] .code { font: 400 15px/1.4 var(--font-mono); opacity: 0.85; word-break: break-all; }
    </style>
    <script>
      (() => {
        const root = document.querySelector('[data-composition-id="s7-multiplayer"]');
        const names = ['mp-0', 'mp-new', 'mp-pair', 'mp-copied', 'mp-pasted', 'mp-live', 'mp-typing', 'mp-both'];
        const layer = (n) => root.querySelector('.st[data-state="' + n + '"]');
        names.forEach((n) => HF.mount(layer(n), n));
        const S = window.STORY;
        const $ = (s) => root.querySelector(s);
        const q = (n, sel) => layer(n).querySelector(sel);
        const byText = (n, text) => [...layer(n).querySelectorAll('*')].find((e) => e.textContent.trim() === text && e.childElementCount <= 2);
        const items = (n) => { const l = q(n, '[data-cap-list]'); return l ? [...l.children] : []; };
        const at = (n, el) => {
          const ly = layer(n), was = ly.style.display;
          ly.style.display = 'block';
          const r = el.getBoundingClientRect(), s = ly.getBoundingClientRect(), k = s.width / 1600;
          ly.style.display = was;
          return { x: (r.left - s.left + r.width / 2) / k, y: (r.top - s.top + r.height / 2) / k };
        };
        const mainBox = (n) => q(n, 'textarea[placeholder="Do anything"]');
        const sendOf = (n) => { let c = mainBox(n); while (c && !c.querySelector('[aria-label^="Model:"]')) c = c.parentElement; const b = c.querySelectorAll('button'); return b[b.length - 1]; };
        // A chat row in the Multiplayer panel, found by its text.
        const row = (n, text) => { let e = byText(n, text); for (let i = 0; i < 2 && e && e.parentElement; i++) e = e.parentElement; return e; };

        // Overlay copy: the invites are the app's own format.
        const invite = (id, name) => 'vivianne-invite:' + btoa(JSON.stringify({ v: 1, id, name })).replace(/=+$/, '').slice(0, 44) + '…';
        $('.who').textContent = S.invite.friendName;
        $('.av').textContent = S.invite.friendName[0];
        $('.b1 .say').textContent = S.invite.sentWith;
        $('.me-code').textContent = invite('sam-3Fh8Lw2nQd6yTb5kJc0X', S.user);
        $('.them-code').textContent = invite('leo-7Kq2hTn4pW9xZ3vB8mR1', S.invite.friendName);

        const tl = gsap.timeline({ paused: true });
        const cut = (name, t) => names.forEach((n) => tl.set(layer(n), { display: n === name ? 'block' : 'none' }, t));
        const cursor = $('.cursor');
        const go = (p, t, d = 0.55) => tl.to(cursor, { x: p.x, y: p.y, duration: d, ease: 'power2.inOut' }, t);
        const press = (t) => HF.click(tl, cursor, t);
        const pop = (el, t) => el && tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, t);

        const P = {
          plus: { x: 32, y: 218 },
          multi: at('mp-new', byText('mp-new', 'Multiplayer project instead')),
          copy: at('mp-pair', byText('mp-pair', 'Copy invite')),
          create: at('mp-pasted', byText('mp-pasted', 'Create shared project')),
          send: at('mp-typing', sendOf('mp-typing')),
        };

        // 0.0  New project → Multiplayer → Copy invite.
        tl.set(cursor, { x: 900, y: 560 }, 0);
        go(P.plus, 0.25, 0.75); press(1.05);
        cut('mp-new', 1.15);
        tl.fromTo(q('mp-new', '[role="dialog"]') || layer('mp-new'), { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 1.15);
        go(P.multi, 1.5); press(2.1);
        cut('mp-pair', 2.2);
        go(P.copy, 2.45); press(3.05);
        cut('mp-copied', 3.15);

        // 3.5  The invites cross in a chat.
        tl.to($('.dim'), { opacity: 1, duration: 0.3 }, 3.5);
        tl.fromTo($('.msgs'), { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'power3.out' }, 3.55);
        tl.fromTo($('.b1'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(1.5)' }, 3.9);
        tl.fromTo($('.b2'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(1.5)' }, 4.7);
        tl.to($('.msgs'), { opacity: 0, y: -30, duration: 0.35, ease: 'power2.in' }, 5.6);
        tl.to($('.dim'), { opacity: 0, duration: 0.3 }, 5.7);

        // 5.9  Leo's invite pasted → create the shared project.
        cut('mp-pasted', 5.9);
        tl.set(cursor, { x: P.copy.x, y: P.copy.y }, 5.9);
        go(P.create, 6.1); press(6.7);

        // 6.8  Leo is here: the pair chip, the Multiplayer panel, the chat.
        cut('mp-live', 6.8);
        const panel = q('mp-live', '.dv-tab[data-tab-panel-id="multiplayer"]');
        pop(row('mp-live', 'in 🔥'), 7.1);
        pop(row('mp-live', S.collabPrompts[0].text), 7.6);
        tl.to(cursor, { x: 760, y: 700, duration: 0.6, ease: 'power2.inOut' }, 7.2);

        // 8.4  Leo puts his Vivianne on the footer; Sam types his prompt.
        cut('mp-typing', 8.4);
        pop(row('mp-typing', S.collabPrompts[1].text), 8.45);
        const box = mainBox('mp-typing');
        const prompt = S.collabPrompts[2].text;
        box.textContent = '';
        const typed = HF.typeText(tl, box, prompt, 8.9, 52);
        go(P.send, typed + 0.05, 0.4); press(typed + 0.5);

        // Both Vivannes at work.
        const t2 = typed + 0.6;
        cut('mp-both', t2);
        items('mp-both').forEach((el, i) => pop(el, t2 + 0.1 + i * 0.3));
        tl.to(cursor, { opacity: 0, duration: 0.3 }, t2 + 0.3);

        // Camera: steady drift; widen to hold both people's work at the end.
        const cam = $('.cam');
        tl.fromTo(cam, { scale: 1.0, x: 0, y: 0 }, { scale: 1.02, x: -10, y: -8, duration: t2, ease: 'none' }, 0);
        tl.to(cam, { scale: 1.04, x: 960 - 1.04 * 960, y: 540 - 1.04 * 540, duration: 14 - t2, ease: 'power1.inOut' }, t2);
        window.__timelines = window.__timelines || {};
        window.__timelines["s7-multiplayer"] = tl;
      })();
    </script>
  </div>
</template>
