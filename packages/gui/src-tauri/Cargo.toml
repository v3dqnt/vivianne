[package]
name = "app"
version = "1.7.3"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `macos-private-api` is REQUIRED by `app.macOSPrivateApi: true` in
# tauri.conf.json (the build fails outright if the config asks for it and
# the feature is off). It is what makes `transparent: true` windows — the
# voice notch and the DIP highlight overlay — actually transparent on macOS
# instead of opaque rectangles. No-op on other platforms.
# `unstable` is what exposes `Window::add_child` — embedding a real browser
# webview inside the app window, positioned over the preview panel. It is the
# only way to show a live, natively-rendered page rather than a screenshot
# feed; camofox has no streaming endpoint (verified: no screencast/mjpeg/ws
# route), so its screenshot API caps at roughly 3fps.
tauri = { version = "2.11.3", features = ["macos-private-api", "unstable", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.2.0"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
# Auto-update from GitHub Releases. `process` is needed to relaunch the app
# after an update installs.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Desktop "turn complete" notifications (Settings -> Notifications).
tauri-plugin-notification = "2"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3.32"
async-stream = "0.3.6"
async-trait = "0.1.89"
dirs = "6.0.0"
base64 = "0.22.1"
rand = "0.9.4"
sha2 = "0.10.9"
lazy_static = "1.5.0"
regex = "1.12.4"
url = "2.5.8"
hmac = "0.12.1"
tiktoken-rs = "0.11.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
toml = "0.8"
serde_yaml = "0.9"
enigo = "0.6"
xcap = "0.9"
image = "0.25"
which = "7.0"
# Native whisper.cpp STT bindings. Bundles + builds whisper.cpp; the "whisper-cpp-log"
# feature is off by default. Uses prebuilt bindings so libclang is not required
# on recent versions, but the C++ toolchain (MSVC on Windows) still must be present.
# log_backend routes whisper.cpp's extremely chatty stderr output (per-token
# decode traces) into the `log` crate, where our Info-level filter drops it.
whisper-rs = { version = "0.16", features = ["log_backend"] }

# Parakeet TDT speech-to-text, via sherpa-onnx.
#
# Not a second whisper: whisper.cpp cannot run a NeMo transducer at all. A TDT
# model is an encoder + decoder + joiner with a duration head, decoded by a
# greedy transducer loop — sherpa-onnx implements that loop, which is the
# reason for taking the dependency rather than driving onnxruntime directly.
#
# `default-features = false` drops `tts` (sherpa's Piper/VITS stack, ~unused
# here — Viv Instant speaks through the webview's SpeechSynthesis) while
# keeping `download-binaries`, which fetches a prebuilt sherpa-onnx instead of
# building it from source with CMake.
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries"] }
# Bundled sqlite3 (no system dep) with FTS5 for real BM25 lexical memory search.
# Note: FTS5 is compiled into the bundled sqlite3 amalgamation by default
# (no separate rusqlite cargo feature needed for it).
rusqlite = { version = "0.32", features = ["bundled"] }
# OS-native credential storage (Windows Credential Manager / macOS Keychain / libsecret)
# for API keys, replacing plaintext credentials.json.
# The per-platform feature flags are REQUIRED: with none enabled, keyring 3.x
# builds only its in-memory "mock" store, which silently discards every write —
# i.e. keys appear to save but never persist. Each feature is cfg-gated to its
# own OS, so enabling all three is the standard cross-platform setup.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
portable-pty = "0.9.0"
# Local ONNX inference for text embeddings (all-MiniLM-L6-v2). Replaces the
# ~200ms OpenAI API round trip with ~3ms local CPU inference, zero API key
# requirement, and offline operation. tract-onnx is the Rust-native ONNX
# runtime (no Python, no system deps beyond the Microsoft Visual C++
# redistributable on Windows). The tokenizers crate is HuggingFace's Rust
# WordPiece tokenizer bundled from source.
tract-onnx = "0.21"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
# Line diffs for the end-of-assignment change review. Diffed here rather than
# in the webview so only changed hunks cross IPC, not two full copies of every
# file an assignment touched.
similar = "2"
ndarray = "0.16"
iroh = "1.0.3"
rquickjs = { version = "0.8.1", default-features = false, features = ["futures"] }
rust_xlsxwriter = "0.92"
docx-rs = "0.4"
printpdf = "0.11"
zip = "4.2"
# Document EDITING, as distinct from the generation crates above.
# Page-level PDF surgery. Already in the tree via printpdf; named directly so
# the version is ours rather than an implementation detail of another crate.
lopdf = "0.34"
# DOCX/PPTX are zips of XML. quick-xml lets the text be rewritten by walking
# real elements instead of regexing markup, which is what keeps a rewritten
# file openable by Word/PowerPoint.
quick-xml = "0.37"

[target."cfg(windows)".dependencies]
uiautomation = "0.25.0"
