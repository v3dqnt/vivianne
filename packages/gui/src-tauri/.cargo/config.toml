# NOTE (cross-platform): every value below is Windows-specific, but Cargo's
# `[env]` table has no cfg support and is applied on every host. It does not
# force, though: a variable already set in the process environment wins. macOS
# and Linux builds therefore go through `packages/gui/scripts/dev-env.mjs`,
# which sets correct values for the host before invoking the Tauri CLI. Do not
# add `force = true` to any entry here without also fixing that script.

# Point whisper-rs's bindgen at the LLVM install so it can find libclang.dll
# without requiring a manually-set LIBCLANG_PATH environment variable.
# Installed via `winget install LLVM.LLVM`.
[env]
LIBCLANG_PATH = "C:\\Program Files\\LLVM\\bin"
# CMake is installed (winget Kitware.CMake) but not on PATH in every shell;
# the `cmake` crate used by whisper-rs-sys honors this override.
CMAKE = "C:\\Program Files\\CMake\\bin\\cmake.exe"
# CMake's Visual Studio generator auto/manual detection could not enumerate
# any installed VS instance on this machine (2019 BuildTools, 2022 BuildTools,
# and 2026 Community are all present, but every "Visual Studio NN YYYY"
# generator failed with "could not find any instance of Visual Studio").
# Ninja sidesteps that lookup entirely — it just needs cl.exe/link.exe on
# PATH, which we provide by running the build from inside a VS Developer
# environment (see scripts/build-with-msvc.ps1).
CMAKE_GENERATOR = "Ninja"
# whisper-rs-sys's shipped bindings.rs is generated on Linux (its layout tests
# reference glibc types like _G_fpos_t) so it can never compile on Windows —
# bindgen MUST run here. The INCLUDE env var set by VsDevCmd.bat gets lost in
# the npm → tauri → cargo process chain, so we spell out every system-header
# search path that clang needs: LLVM builtins (stdbool.h), MSVC CRT, and the
# Windows SDK (UCRT for stdio.h, shared, um).
BINDGEN_EXTRA_CLANG_ARGS = "-I\"C:\\Program Files\\LLVM\\lib\\clang\\22\\include\" -I\"C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\BuildTools\\VC\\Tools\\MSVC\\14.29.30133\\include\" -I\"C:\\Program Files (x86)\\Windows Kits\\10\\include\\10.0.19041.0\\ucrt\" -I\"C:\\Program Files (x86)\\Windows Kits\\10\\include\\10.0.19041.0\\shared\" -I\"C:\\Program Files (x86)\\Windows Kits\\10\\include\\10.0.19041.0\\um\""
