<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #ffffff;
      }
      /* Film grain, as the brand asks: barely there. */
      #grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.035;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="64.65" data-width="1920" data-height="1080">
      <div id="f01-open" data-composition-id="f01-open" data-composition-src="compositions/f01-open.html" data-start="0" data-duration="4.05" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="f02-engine" data-layout-allow-overlap data-composition-id="f02-engine" data-composition-src="compositions/f02-engine.html" data-start="3.6" data-duration="8" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="f03-router" data-layout-allow-overlap data-composition-id="f03-router" data-composition-src="compositions/f03-router.html" data-start="11.2" data-duration="10" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="f04-threads" data-layout-allow-overlap data-composition-id="f04-threads" data-composition-src="compositions/f04-threads.html" data-start="20.8" data-duration="5" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="f04-agents" data-layout-allow-overlap data-composition-id="f04-agents" data-composition-src="compositions/f04-agents.html" data-start="25.4" data-duration="8.5" data-track-index="5" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="f04-company" data-layout-allow-overlap data-composition-id="f04-company" data-composition-src="compositions/f04-company.html" data-start="33.5" data-duration="8.5" data-track-index="6" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="f05-memory" data-layout-allow-overlap data-composition-id="f05-memory" data-composition-src="compositions/f05-memory.html" data-start="41.6" data-duration="8.5" data-track-index="7" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="f06-world" data-layout-allow-overlap data-composition-id="f06-world" data-composition-src="compositions/f06-world.html" data-start="49.7" data-duration="8.2" data-track-index="8" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="f07-instant" data-layout-allow-overlap data-composition-id="f07-instant" data-composition-src="compositions/f07-instant.html" data-start="57.45" data-duration="7.2" data-track-index="9" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="grain" class="clip" data-start="0" data-duration="64.65" data-track-index="20"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Every scene arrives out of a soft blur while the one before it is
      // still leaving: no hard cuts, no white flashes between scenes.
      const arrive = (id, t, d = 0.5) => tl.fromTo("#" + id, { opacity: 0, filter: "blur(14px)", scale: 0.985 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: d, ease: "power2.out", immediateRender: false }, t);
      arrive("f02-engine", 3.6, 0.45);
      // 02 → 03: a push to the right; the stream gives way to the settings beside it.
      tl.fromTo("#f03-router", { xPercent: 100 }, { xPercent: 0, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 11.2);
      tl.fromTo("#f02-engine", { xPercent: 0 }, { xPercent: -35, duration: 0.7, ease: "power3.inOut", immediateRender: false }, 11.2);
      arrive("f04-threads", 20.8);
      arrive("f04-agents", 25.4);
      arrive("f04-company", 33.5);
      arrive("f05-memory", 41.6);
      arrive("f06-world", 49.7);
      arrive("f07-instant", 57.45);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
