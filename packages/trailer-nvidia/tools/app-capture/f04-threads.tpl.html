        <audio id="f04t-sfx-scroll" data-hf-media-start-basis="local" src="assets/sfx/whoosh-cinematic.mp3" data-start="0.9" data-duration="2.6" data-track-index="81" data-volume="0.22"></audio>
        <audio id="f04t-sfx-pop" data-hf-media-start-basis="local" src="assets/sfx/pop.mp3" data-start="0.45" data-duration="0.72" data-track-index="82" data-volume="0.3"></audio>

      <script>
        (function () {
          const FILM = 5;
          const tl = gsap.timeline({ paused: true });
          const root = document.getElementById("f04t-root");
          const space = document.getElementById("f04t-space");
          const side = document.getElementById("f04t-side");
          const st = root.querySelector(".ap-state");

          // ── The list that scrolls: the sidebar's tallest scrollable box.
          side.style.transform = "none";
          const boxes = [...st.querySelectorAll("*")].filter((e) => e.scrollHeight > e.clientHeight + 40 && e.getBoundingClientRect().left < side.getBoundingClientRect().left + 400);
          const list = boxes.sort((a, b) => b.scrollHeight - a.scrollHeight)[0];
          const MAX = list ? list.scrollHeight - list.clientHeight : 0;
          // Thread rows: the sidebar's single-line links under the dates.
          const rows = [...st.querySelectorAll("*")].filter((e) => e.childElementCount === 0 && (e.textContent || "").trim().length > 3 && e.getBoundingClientRect().left < side.getBoundingClientRect().left + 300 && e.getBoundingClientRect().top > 300 && e.getBoundingClientRect().top < 1400);
          side.style.transform = "";

          // Rows rise in, then the list runs down through every thread.
          gsap.set(rows.slice(0, 16), { opacity: 0, x: -16 });
          tl.to(rows.slice(0, 16), { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.03 }, 0.2);
          const sc = { y: 0 };
          if (list) tl.fromTo(sc, { y: 0 }, { y: MAX, duration: 2.8, ease: "power2.inOut", immediateRender: false, onUpdate: () => (list.scrollTop = sc.y) }, 1.0);

          // The count runs up with the scroll.
          const n = { v: 0 };
          const out = document.getElementById("f04t-n");
          tl.fromTo(n, { v: 0 }, { v: 40, duration: 3.0, ease: "power2.inOut", immediateRender: false, onUpdate: () => (out.textContent = String(Math.round(n.v))) }, 0.9);

          // ── Copy.
          const ws = [...root.querySelectorAll("#f04t-h .f04t-w")];
          gsap.set(ws, { yPercent: 120, scale: 0.86, opacity: 0, filter: "blur(10px)" });
          tl.to(ws, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "back.out(1.7)", stagger: 0.08 }, 0.3);
          gsap.set(["#f04t-s", "#f04t-count"], { opacity: 0, y: 24, filter: "blur(8px)" });
          tl.to("#f04t-s", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0.75);
          tl.to("#f04t-count", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0.95);
          tl.to("#f04t-copy", { opacity: 0, y: -30, filter: "blur(10px)", duration: 0.45, ease: "power2.in" }, 4.45);

          // ── Camera: down the length of the sidebar, then away.
          const KEYS = [
            [0.0, 0, 260, -700, 10, -12],
            [1.0, 0, 120, -240, 4, -6],
            [3.6, 0, -330, -200, -2, -4],
            [5.0, 120, -520, -1100, -10, 10],
          ];
          const C = KEYS[0].length - 1;
          const slopes = [];
          for (let c = 1; c <= C; c++) {
            const nK = KEYS.length;
            const d = [];
            for (let i = 0; i < nK - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
            const m = new Array(nK).fill(0);
            for (let i = 1; i < nK - 1; i++) {
              if (d[i - 1] * d[i] > 0) {
                const h0 = KEYS[i][0] - KEYS[i - 1][0];
                const h1 = KEYS[i + 1][0] - KEYS[i][0];
                const w1 = 2 * h1 + h0;
                const w2 = h1 + 2 * h0;
                m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
              }
            }
            slopes.push(m);
          }
          const camAt = (t) => {
            if (t <= KEYS[0][0]) return KEYS[0].slice(1);
            const last = KEYS[KEYS.length - 1];
            if (t >= last[0]) return last.slice(1);
            let i = 0;
            while (t > KEYS[i + 1][0]) i++;
            const h = KEYS[i + 1][0] - KEYS[i][0];
            const u = (t - KEYS[i][0]) / h;
            const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
            const h10 = u ** 3 - 2 * u ** 2 + u;
            const h01 = -2 * u ** 3 + 3 * u ** 2;
            const h11 = u ** 3 - u ** 2;
            const v = [];
            for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
            return v;
          };
          const clock = { t: 0 };
          const apply = () => {
            const [x, y, z, rx, ry] = camAt(clock.t);
            space.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          apply();
          tl.to(clock, { t: FILM, duration: FILM, ease: "none", onUpdate: apply }, 0);
          tl.to("#f04t-stage", { opacity: 0, filter: "blur(12px)", duration: 0.5, ease: "power2.in" }, 4.5);

          window.__timelines["f04-threads"] = tl;
        })();
      </script>
