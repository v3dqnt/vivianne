      <script>
        (function () {
          const FILM = 8.5;
          const PERSP = 1100;
          const tl = gsap.timeline({ paused: true });
          const root = document.getElementById("f04a-root");
          const space = document.getElementById("f04a-space");
          const win = document.getElementById("f04a-win");
          const st = root.querySelector(".ap-state");

          // ── Measure the room flat, once.
          space.style.transform = "none";
          const W0 = win.getBoundingClientRect();
          const leaf = (text, maxX) => [...st.querySelectorAll("*")].find((e) => e.childElementCount === 0 && (e.textContent || "").trim() === text && e.getBoundingClientRect().left - W0.left < (maxX ?? 9999));
          const rowOf = (el) => {
            while (el && el.parentElement && el.parentElement !== st) {
              const r = el.parentElement.getBoundingClientRect();
              if (r.height > 90 || r.width > 1000) break;
              el = el.parentElement;
            }
            return el;
          };
          const rel = leaf("Release", 330);
          const RR = rel.getBoundingClientRect();
          const AV = { x: RR.left - W0.left - 24, y: RR.top - W0.top + RR.height / 2 + 6 };
          const ROWS = ["Everyone", "Reviewer", "QA", "Release"].map((t) => rowOf(leaf(t, 330))).filter(Boolean);
          const MSGS = ["Heading out. @everyone get the refunds PR merged tonight.", "Reviewed #88. One nit, fixed it. Approved.", "Full e2e on staging: 132 passed, refunds included.", "Merging after the nightly build at 02:00."].map((t) => rowOf(leaf(t))).filter(Boolean);
          space.style.transform = "";

          // ── Camera on the window: keys [t, focusX, focusY, z, rx, ry].
          const KEYS = [
            [0.0, 640, 420, -1800, 8, -10],
            [2.5, 640, 430, -500, 6, -8],
            [3.2, 640, 420, 200, 0, 0],
            [5.0, 820, 300, 250, 1, -2],
            [5.9, 1500, 540, 330, 0, 2],
            [8.5, 1520, 550, 380, 0, 3],
          ];
          const C = KEYS[0].length - 1;
          const slopes = [];
          for (let c = 1; c <= C; c++) {
            const n = KEYS.length;
            const d = [];
            for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
            const m = new Array(n).fill(0);
            for (let i = 1; i < n - 1; i++) {
              if (d[i - 1] * d[i] > 0) {
                const h0 = KEYS[i][0] - KEYS[i - 1][0];
                const h1 = KEYS[i + 1][0] - KEYS[i][0];
                const w1 = 2 * h1 + h0;
                const w2 = h1 + 2 * h0;
                m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
              }
            }
            slopes.push(m);
          }
          const camAt = (t) => {
            if (t <= KEYS[0][0]) return KEYS[0].slice(1);
            const last = KEYS[KEYS.length - 1];
            if (t >= last[0]) return last.slice(1);
            let i = 0;
            while (t > KEYS[i + 1][0]) i++;
            const h = KEYS[i + 1][0] - KEYS[i][0];
            const u = (t - KEYS[i][0]) / h;
            const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
            const h10 = u ** 3 - 2 * u ** 2 + u;
            const h01 = -2 * u ** 3 + 3 * u ** 2;
            const h11 = u ** 3 - u ** 2;
            const v = [];
            for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
            return v;
          };
          const clock = { t: 0 };
          const apply = () => {
            const [fx, fy, z, rx, ry] = camAt(clock.t);
            space.style.transform = `translate3d(${960 - fx}px, ${540 - fy}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          apply();
          tl.to(clock, { t: FILM, duration: FILM, ease: "none", onUpdate: apply }, 0);

          // ── The head's frames, stepped by the film's clock.
          const frames = [...root.querySelectorAll(".f04a-f")];
          let shown = -1;
          const fr = { t: 0 };
          const showFrame = () => {
            const i = Math.min(frames.length - 1, Math.max(0, Math.floor(fr.t * 30)));
            if (i === shown) return;
            if (shown >= 0) frames[shown].style.visibility = "hidden";
            frames[i].style.visibility = "visible";
            shown = i;
          };
          showFrame();
          tl.fromTo(fr, { t: 0 }, { t: 3.5, duration: 3.5, ease: "none", immediateRender: false, onUpdate: showFrame }, 0);

          // ── The head: wakes, thinks, works; its label follows the app's own words.
          tl.fromTo("#f04a-head", { scale: 0.82, opacity: 0, filter: "blur(12px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out", immediateRender: true }, 0);
          const labs = ["#f04a-l0", "#f04a-l1", "#f04a-l2"];
          [0.15, 0.75, 1.85].forEach((t, i) => {
            if (i > 0) tl.to(labs[i - 1], { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" }, t - 0.05);
            tl.fromTo(labs[i], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
          });
          tl.fromTo("#f04a-pill", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: true }, 0.15);
          tl.to("#f04a-pill", { opacity: 0, y: 20, duration: 0.3, ease: "power2.in" }, 2.45);

          // It flies into the room and becomes Release's avatar there.
          const s = PERSP / (PERSP - 200);
          const tx = 960 + (AV.x - 640) * s;
          const ty = 540 + (AV.y - 420) * s;
          tl.to("#f04a-head", { x: tx - 960, y: ty - 530, scale: 0.12, duration: 0.7, ease: "power3.inOut" }, 2.5);
          tl.to("#f04a-head", { opacity: 0, duration: 0.18, ease: "power1.in" }, 3.05);
          tl.fromTo("#f04a-stage", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out", immediateRender: true }, 2.45);

          tl.to("#f04a-veil", { opacity: 1, duration: 0.4 }, 2.6);
          // The room fills in: who's here, then what they've said.
          gsap.set([...ROWS, ...MSGS], { opacity: 0, y: 16 });
          tl.to(ROWS, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.08 }, 2.9);
          tl.to(MSGS, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.22 }, 3.4);

          // ── Headlines and the three facts.
          const pop = (sel, t) => {
            const ws = [...root.querySelectorAll(sel + " .f04a-w")];
            gsap.set(ws, { yPercent: 120, scale: 0.86, opacity: 0, filter: "blur(10px)" });
            tl.to(ws, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "back.out(1.7)", stagger: 0.06 }, t);
            return ws;
          };
          const w1 = pop("#f04a-h1", 0.25);
          tl.to(w1, { opacity: 0, yPercent: -60, filter: "blur(8px)", duration: 0.35, ease: "power2.in", stagger: 0.03 }, 5.0);
          pop("#f04a-h2", 5.45);
          const cards = [...root.querySelectorAll(".f04a-card")];
          gsap.set(cards, { opacity: 0, x: -50, filter: "blur(8px)" });
          tl.to(cards, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", stagger: 0.3 }, 5.8);
          tl.to(["#f04a-heads", "#f04a-cards", "#f04a-stage"], { opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power2.in" }, 8.05);

          window.__timelines["f04-agents"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
