      <div id="f08-root" data-composition-id="f08-ui" data-width="1920" data-height="1080">

        <audio id="f08-sfx-b1" data-hf-media-start-basis="local" src="assets/sfx/click-soft.mp3" data-start="0.7" data-duration="0.37" data-track-index="120" data-volume="0.35"></audio>
        <audio id="f08-sfx-b2" data-hf-media-start-basis="local" src="assets/sfx/click-soft.mp3" data-start="1.3" data-duration="0.37" data-track-index="121" data-volume="0.35"></audio>
        <audio id="f08-sfx-b3" data-hf-media-start-basis="local" src="assets/sfx/click-soft.mp3" data-start="2.0" data-duration="0.37" data-track-index="122" data-volume="0.35"></audio>

        <audio id="f08-sfx-t1" data-hf-media-start-basis="local" src="assets/sfx/pop.mp3" data-start="3.75" data-duration="0.72" data-track-index="124" data-volume="0.25"></audio>
        <audio id="f08-sfx-t2" data-hf-media-start-basis="local" src="assets/sfx/pop.mp3" data-start="4.15" data-duration="0.72" data-track-index="125" data-volume="0.25"></audio>
        <audio id="f08-sfx-land" data-hf-media-start-basis="local" src="assets/sfx/impact-bass-2.mp3" data-start="4.7" data-duration="1.6" data-track-index="126" data-volume="0.35"></audio>

      <script>
        (function () {
          const FILM = 7;
          const tl = gsap.timeline({ paused: true });
          const root = document.getElementById("f08-root");
          const space = document.getElementById("f08-space");
          const win = document.getElementById("f08-win");
          const stateEl = (id) => [...root.querySelectorAll(".ap-state")].find((n) => n.dataset.state === id);
          const U1 = stateEl("u1");
          const U2 = stateEl("u2");

          // ── Measure once, flat, both states showing.
          space.style.transform = "none";
          U1.style.opacity = "1";
          U2.style.opacity = "1";
          const W0 = win.getBoundingClientRect();
          const box = (el) => {
            const r = el.getBoundingClientRect();
            return { x: r.left - W0.left, y: r.top - W0.top, w: r.width, h: r.height };
          };
          const leaves = (st, test) => [...st.querySelectorAll("*")].filter((e) => e.childElementCount === 0 && test((e.textContent || "").trim(), box(e)));
          const rowOf = (st, el, maxH = 90, maxW = 1000) => {
            while (el && el.parentElement && el.parentElement !== st) {
              const r = box(el.parentElement);
              if (r.h > maxH || r.w > maxW) break;
              el = el.parentElement;
            }
            return el;
          };
          const one = (st, text) => leaves(st, (t) => t === text)[0];
          // The card, block by block: title row, the three stats, the steps, the callout, the buttons.
          const STATS = ["ROWS BACKFILLED", "BATCHES", "ERRORS", "Rows backfilled", "Batches", "Errors"].map((t) => one(U1, t)).filter(Boolean).map((e) => rowOf(U1, e, 100, 300));
          const STEPS = ["Add orders_v2 beside the old table", "Backfill in batches of 5,000", "Switch reads behind a flag", "Drop the old table"].map((t) => rowOf(U1, one(U1, t), 40, 700));
          const CALL = rowOf(U1, one(U1, "Rollback is one flag flip."), 50, 900);
          const BTNS = [...U1.querySelectorAll("button")].filter((b) => /Switch reads now|Show the dry run/.test(b.textContent || ""));
          const TITLE = rowOf(U1, one(U1, "Orders migration"), 40, 300);
          const NUM = one(U1, "1,240,000");
          const CARD = box(rowOf(U1, one(U1, "Orders migration"), 520, 1000));
          // The layout: quick-access tiles, and the rows of the stacked panels.
          const TILES = leaves(U2, (t, r) => r.y > 820 && r.y < 930 && ["Terminal", "All files", "Agents", "Plan", "Preview", "Git review", "Background tasks", "Timeline", "Memory", "Multiplayer"].includes(t)).map((e) => rowOf(U2, e, 70, 200));
          const SIDE = leaves(U2, (t, r) => r.x > 1545 && r.y > 80 && t.length > 2).map((e) => rowOf(U2, e, 80, 360));
          const sideSet = [...new Set(SIDE)];
          U1.style.opacity = "";
          U2.style.opacity = "";
          space.style.transform = "";

          // ── The card builds itself.
          tl.set(U1, { opacity: 1 }, 0);
          const blocks = [TITLE, ...STATS, ...STEPS, CALL, ...BTNS].filter(Boolean);
          gsap.set(blocks, { opacity: 0, y: 18 });
          tl.to(TITLE, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.35);
          tl.to(STATS, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)", stagger: 0.12 }, 0.6);
          if (NUM) {
            const v = { n: 0 };
            tl.fromTo(v, { n: 0 }, { n: 1240000, duration: 1.0, ease: "power2.out", immediateRender: false, onUpdate: () => (NUM.textContent = Math.round(v.n).toLocaleString("en-US")) }, 0.65);
          }
          tl.to(STEPS, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.14 }, 1.2);
          tl.to(CALL, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.85);
          tl.to(BTNS, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)", stagger: 0.1 }, 2.05);

          // ── The layout changes round it: panels stack in, tiles pop up.
          tl.set(U2, { opacity: 1 }, 3.3);
          tl.set(U1, { opacity: 0 }, 3.3);
          gsap.set(TILES, { opacity: 0, y: 30, scale: 0.9 });
          tl.to(TILES, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.05 }, 3.6);
          gsap.set(sideSet, { opacity: 0, x: 40 });
          tl.to(sideSet, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.04 }, 3.45);

          // ── Headlines.
          const pop = (sel, t, out) => {
            const ws = [...root.querySelectorAll(sel + " .f08-w")];
            gsap.set(ws, { yPercent: 120, scale: 0.86, opacity: 0, filter: "blur(10px)" });
            tl.to(ws, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "back.out(1.7)", stagger: 0.06 }, t);
            if (out) tl.to(ws, { opacity: 0, yPercent: -60, filter: "blur(8px)", duration: 0.3, ease: "power2.in", stagger: 0.02 }, out);
          };
          tl.to("#f08-veil", { opacity: 1, duration: 0.4 }, 0.1);
          pop("#f08-h1", 0.25, 3.05);
          pop("#f08-h2", 3.6);

          // ── Camera: [t, focusX, focusY, z, rx, ry]. Close on the card as it
          // builds, then back for the whole window as the layout changes.
          const cx = CARD.x + CARD.w / 2;
          const cy = CARD.y + CARD.h / 2;
          const KEYS = [
            [0.0, cx - 120, cy + 60, 260, 6, -8],
            [1.2, cx, cy - 10, 420, 2, -2],
            [3.0, cx + 20, cy - 20, 450, 0, 1],
            [3.9, 1000, 600, 110, 2, 3],
            [7.0, 1000, 610, 170, 0, -2],
          ];
          const C = KEYS[0].length - 1;
          const slopes = [];
          for (let c = 1; c <= C; c++) {
            const n = KEYS.length;
            const d = [];
            for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
            const m = new Array(n).fill(0);
            for (let i = 1; i < n - 1; i++) {
              if (d[i - 1] * d[i] > 0) {
                const h0 = KEYS[i][0] - KEYS[i - 1][0];
                const h1 = KEYS[i + 1][0] - KEYS[i][0];
                const w1 = 2 * h1 + h0;
                const w2 = h1 + 2 * h0;
                m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
              }
            }
            slopes.push(m);
          }
          const camAt = (t) => {
            if (t <= KEYS[0][0]) return KEYS[0].slice(1);
            const last = KEYS[KEYS.length - 1];
            if (t >= last[0]) return last.slice(1);
            let i = 0;
            while (t > KEYS[i + 1][0]) i++;
            const h = KEYS[i + 1][0] - KEYS[i][0];
            const u = (t - KEYS[i][0]) / h;
            const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
            const h10 = u ** 3 - 2 * u ** 2 + u;
            const h01 = -2 * u ** 3 + 3 * u ** 2;
            const h11 = u ** 3 - u ** 2;
            const v = [];
            for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
            return v;
          };
          const clock = { t: 0 };
          const apply = () => {
            const [fx, fy, z, rx, ry] = camAt(clock.t);
            space.style.transform = `translate3d(${960 - fx}px, ${540 - fy}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          apply();
          tl.to(clock, { t: FILM, duration: FILM, ease: "none", onUpdate: apply }, 0);
          tl.to(["#f08-stage", "#f08-heads", "#f08-veil"], { opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power2.in" }, 6.55);

          window.__timelines["f08-ui"] = tl;
        })();
      </script>
