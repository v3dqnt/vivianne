      <script>
        (function () {
          const FILM = 8.5;
          const tl = gsap.timeline({ paused: true });
          const root = document.getElementById("f05-root");
          const world = document.getElementById("f05-world");
          const panel = document.getElementById("f05-panel");
          const st = root.querySelector(".ap-state");

          // ── Measure the panel flat, once.
          const savedT = panel.style.transform;
          panel.style.transform = "none";
          world.style.transform = "none";
          const P0 = panel.getBoundingClientRect();
          const leafOf = (text) => [...st.querySelectorAll("*")].find((el) => (el.textContent || "").trim() === text && [...el.children].every((c) => (c.textContent || "").trim() !== text));
          // An entry: the text's ancestor box with the tinted background.
          const entryOf = (text) => {
            let el = leafOf(text);
            while (el && el.parentElement && el.getBoundingClientRect().height < 50) el = el.parentElement;
            return el;
          };
          const ENTRIES = [
            "Prefers small PRs, with a test for every fix.",
            "Never deploys after 18:00 IST.",
            "Orders live in Postgres 15; order_id is a bigint.",
            "Backfills run in batches of 5,000 to keep locks short.",
            "Refund webhooks retry 3 times, then page on-call.",
            "Planned the orders_v2 migration; the dry run passed.",
          ].map(entryOf).filter(Boolean);
          const HEADS = [leafOf("ABOUT YOU · 2") || leafOf("About you · 2"), leafOf("THIS PROJECT · 4") || leafOf("This project · 4")].filter(Boolean);
          const hot = ENTRIES[3].getBoundingClientRect();
          const HL = { x: hot.left - P0.left - 4, y: hot.top - P0.top - 4, w: hot.width + 8, h: hot.height + 8 };
          panel.style.transform = savedT;
          world.style.transform = "";
          const hl = document.getElementById("f05-hl");
          Object.assign(hl.style, { left: HL.x + "px", top: HL.y + "px", width: HL.w + "px", height: HL.h + "px" });

          // ── Entries arrive one by one; the one the chat just used lights up.
          gsap.set([...HEADS, ...ENTRIES], { opacity: 0, y: 18 });
          tl.to([HEADS[0], ENTRIES[0], ENTRIES[1], HEADS[1], ...ENTRIES.slice(2)].filter(Boolean), { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 }, 0.7);
          tl.fromTo(hl, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, 2.6);
          tl.to(ENTRIES[3], { scale: 1.03, duration: 0.45, ease: "back.out(2)" }, 2.6);

          // ── The cloud: seeded points in depth, which the camera dollies through.
          let seed = 11;
          const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
          const cloud = document.getElementById("f05-cloud");
          for (let i = 0; i < 90; i++) {
            const el = document.createElement("div");
            el.className = "f05-dot";
            const s = 5 + rnd() * 7;
            el.style.width = el.style.height = s + "px";
            el.style.opacity = (0.12 + rnd() * 0.3).toFixed(2);
            el.style.transform = `translate3d(${(-200 + rnd() * 2320).toFixed(0)}px, ${(-100 + rnd() * 1280).toFixed(0)}px, ${(-2200 + rnd() * 3000).toFixed(0)}px)`;
            cloud.appendChild(el);
          }

          // ── The constellation: points link up as memories are found.
          const net = document.getElementById("f05-net");
          const NS = "http://www.w3.org/2000/svg";
          const N = [
            [120, 160], [330, 90], [520, 220], [760, 120], [980, 260], [1100, 80],
            [210, 420], [450, 470], [690, 380], [900, 520], [1120, 430],
            [140, 700], [380, 760], [620, 660], [860, 760], [1080, 690],
          ];
          const E = [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5], [0, 6], [6, 7], [7, 2], [7, 8], [8, 3], [8, 9], [9, 4], [9, 10], [10, 5], [6, 11], [11, 12], [12, 7], [12, 13], [13, 8], [13, 14], [14, 9], [14, 15], [15, 10]];
          const lines = E.map(([a, b]) => {
            const l = document.createElementNS(NS, "line");
            l.setAttribute("x1", N[a][0]);
            l.setAttribute("y1", N[a][1]);
            l.setAttribute("x2", N[b][0]);
            l.setAttribute("y2", N[b][1]);
            const len = Math.hypot(N[b][0] - N[a][0], N[b][1] - N[a][1]);
            l.style.strokeDasharray = len;
            l.style.strokeDashoffset = len;
            net.appendChild(l);
            return l;
          });
          const dots = N.map(([x, y], i) => {
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("cx", x);
            c.setAttribute("cy", y);
            c.setAttribute("r", i === 5 ? 10 : 7);
            if (i === 5) c.setAttribute("class", "hot");
            net.appendChild(c);
            return c;
          });
          gsap.set(dots, { opacity: 0, scale: 0, transformOrigin: "50% 50%" });
          tl.to(dots, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)", stagger: 0.05 }, 0.5);
          tl.to(lines, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out", stagger: 0.07 }, 0.95);
          tl.fromTo(dots[5], { scale: 1 }, { scale: 1.8, duration: 0.5, ease: "back.out(2)", immediateRender: false }, 2.6);

          // ── The spec card.
          gsap.set(["#f05-t1", "#f05-t2"], { yPercent: 110 });
          tl.to("#f05-t1", { yPercent: 0, duration: 0.8, ease: "expo.out" }, 1.25);
          tl.to("#f05-t2", { yPercent: 0, duration: 0.8, ease: "expo.out" }, 1.4);
          const rows = [...root.querySelectorAll(".f05-row")];
          gsap.set(rows, { opacity: 0, x: 40 });
          tl.fromTo("#f05-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut", immediateRender: true }, 1.8);
          tl.to(rows, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out", stagger: 0.24 }, 2.0);

          tl.to("#f05-net", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.25);
          // ── The scores count up, their bars fill.
          gsap.set("#f05-score h2, #f05-score p", { opacity: 0, y: 24, filter: "blur(8px)" });
          tl.to("#f05-score h2", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 5.0);
          tl.to("#f05-score p", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 5.2);
          const nums = [...root.querySelectorAll(".f05-num")];
          gsap.set(nums, { opacity: 0, y: 40 });
          tl.to(nums, { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.4)", stagger: 0.18 }, 5.4);
          nums.forEach((n, i) => {
            const b = n.querySelector("b");
            const to = Number(b.dataset.to);
            const v = { x: 0 };
            tl.fromTo(v, { x: 0 }, { x: to, duration: 1.3, ease: "power2.out", immediateRender: false, onUpdate: () => (b.textContent = Math.round(v.x) + "%") }, 5.55 + i * 0.18);
            tl.fromTo(n.querySelector(".f05-bar i"), { scaleX: 0 }, { scaleX: 1, duration: 1.3, ease: "power2.out", immediateRender: true }, 5.55 + i * 0.18);
          });

          // ── Camera: keys [t, x, y, z, rx, ry] through a monotone cubic. It dollies
          // back through the cloud, drifts in a slow orbit, then rises out.
          const KEYS = [
            [0.0, -260, 40, 620, 4, -14],
            [1.4, 0, 0, -80, 2, 4],
            [4.3, -20, 0, -40, 1, 0],
            [5.0, -1920, 0, -120, 1, 0],
            [8.0, -1920, 0, 0, 0, -3],
            [8.5, -1920, -500, -900, 10, -3],
          ];
          const C = KEYS[0].length - 1;
          const slopes = [];
          for (let c = 1; c <= C; c++) {
            const n = KEYS.length;
            const d = [];
            for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
            const m = new Array(n).fill(0);
            for (let i = 1; i < n - 1; i++) {
              if (d[i - 1] * d[i] > 0) {
                const h0 = KEYS[i][0] - KEYS[i - 1][0];
                const h1 = KEYS[i + 1][0] - KEYS[i][0];
                const w1 = 2 * h1 + h0;
                const w2 = h1 + 2 * h0;
                m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
              }
            }
            slopes.push(m);
          }
          const camAt = (t) => {
            if (t <= KEYS[0][0]) return KEYS[0].slice(1);
            const last = KEYS[KEYS.length - 1];
            if (t >= last[0]) return last.slice(1);
            let i = 0;
            while (t > KEYS[i + 1][0]) i++;
            const h = KEYS[i + 1][0] - KEYS[i][0];
            const u = (t - KEYS[i][0]) / h;
            const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
            const h10 = u ** 3 - 2 * u ** 2 + u;
            const h01 = -2 * u ** 3 + 3 * u ** 2;
            const h11 = u ** 3 - u ** 2;
            const v = [];
            for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
            return v;
          };
          const clock = { t: 0 };
          const apply = () => {
            const [x, y, z, rx, ry] = camAt(clock.t);
            world.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          apply();
          tl.to(clock, { t: FILM, duration: FILM, ease: "none", onUpdate: apply }, 0);

          tl.fromTo("#f05-veil", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 0);
          tl.to("#f05-stage", { opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power2.in" }, 8.05);
          gsap.set("#f05-veil", { opacity: 1 });

          window.__timelines["f05-memory"] = tl;
        })();
      </script>
