          <span class="f02-mask"><span class="f02-line" id="f02-l2"><span class="f02-w">Runs</span> <span class="f02-w">on</span> <span class="f02-w f02-grad n">Nebius</span> <span class="f02-w f02-grad n">Token</span> <span class="f02-w f02-grad n">Factory.</span></span></span>
        </div>

        <audio id="f02-sfx-c1" data-hf-media-start-basis="local" src="assets/sfx/click.mp3" data-start="1.4" data-duration="0.37" data-track-index="70" data-volume="0.55"></audio>
        <audio id="f02-sfx-c2" data-hf-media-start-basis="local" src="assets/sfx/click.mp3" data-start="2.15" data-duration="0.37" data-track-index="71" data-volume="0.55"></audio>
        <audio id="f02-sfx-type" data-hf-media-start-basis="local" src="assets/sfx/typing.mp3" data-start="2.5" data-duration="1.3" data-track-index="72" data-volume="0.45"></audio>

        <audio id="f02-sfx-l2" data-hf-media-start-basis="local" src="assets/sfx/pop.mp3" data-start="5.9" data-duration="0.72" data-track-index="76" data-volume="0.35"></audio>

      <script>
        (function () {
          const FILM = 8;
          const tl = gsap.timeline({ paused: true });
          const root = document.getElementById("f02-root");
          const win = document.getElementById("f02-win");
          const world = document.getElementById("f02-world");
          const stateEl = (id) => [...root.querySelectorAll(".ap-state")].find((n) => n.dataset.state === id);
          const E1 = stateEl("e1");
          const E2 = stateEl("e2");

          // ── Measure the captured UI once, at setup, with the camera at rest.
          world.style.transform = "none";
          const W0 = win.getBoundingClientRect();
          const inWin = (el) => {
            const r = el.getBoundingClientRect();
            return { x: r.left - W0.left, y: r.top - W0.top, w: r.width, h: r.height, cx: r.left - W0.left + r.width / 2, cy: r.top - W0.top + r.height / 2 };
          };
          E1.style.opacity = "1";
          E2.style.opacity = "1";
          const chipEl = [...E1.querySelectorAll("button")].find((b) => /Auto \(cost-aware router\)/.test(b.textContent || ""));
          const rowEl = [...E2.querySelectorAll("*")].filter((el) => el.childElementCount === 0 && /^Auto \(cost-aware router\)$/.test((el.textContent || "").trim())).map((el) => [el, inWin(el)]).sort((a, b) => a[1].y - b[1].y)[0];
          // MUI keeps a hidden twin textarea for auto-sizing: take the visible one.
          const area = E1.querySelector("textarea:not([aria-hidden])");
          const send = [...E1.querySelectorAll("button")].filter((b) => inWin(b).y > 960).sort((a, b) => inWin(b).x - inWin(a).x)[0];
          const CHIP = inWin(chipEl);
          const ROW = rowEl[1];
          const AREA = inWin(area);
          const SEND = inWin(send);
          E1.style.opacity = "";
          E2.style.opacity = "";

          // The typed prompt sits exactly where the field's text would be.
          const cs = getComputedStyle(area);
          area.setAttribute("placeholder", "");
          const typed = document.getElementById("f02-typed");
          typed.style.left = AREA.x + parseFloat(cs.paddingLeft) + "px";
          typed.style.top = AREA.y + parseFloat(cs.paddingTop) + "px";
          typed.style.fontSize = cs.fontSize;
          typed.style.lineHeight = cs.lineHeight;
          const PROMPT = "Plan the database migration for orders";
          const out = document.getElementById("f02-typed-text");
          const tp = { n: 0 };
          const typeAt = 2.5;
          const typeDur = 1.25;
          tl.set("#f02-typed", { opacity: 1 }, typeAt);
          tl.fromTo(tp, { n: 0 }, { n: PROMPT.length, duration: typeDur, ease: "none", onUpdate: () => (out.textContent = PROMPT.slice(0, Math.round(tp.n))) }, typeAt);
          tl.set("#f02-typed-caret", { opacity: 0 }, 3.95);

          // ── States: the app re-renders, so they swap instantly.
          tl.set(E1, { opacity: 1 }, 0);
          tl.set(E1, { opacity: 0 }, 1.45);
          tl.set(E2, { opacity: 1 }, 1.45);
          tl.set(E2, { opacity: 0 }, 2.22);
          tl.set(E1, { opacity: 1 }, 2.22);

          // ── The cursor: opens the picker, picks Auto, and leaves.
          const TIP = 5;
          const at = (p) => ({ x: p.cx - TIP, y: p.cy - TIP });
          tl.set("#f02-cursor", { opacity: 1, x: CHIP.cx + 260, y: CHIP.cy + 180 }, 0.85);
          tl.to("#f02-cursor", { ...at(CHIP), duration: 0.5, ease: "power3.inOut" }, 0.85);
          const press = (target, t, rip, p) => {
            tl.to(["#f02-cursor", target], { scale: 0.88, duration: 0.07, ease: "power2.in" }, t);
            tl.to(["#f02-cursor", target], { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t + 0.07);
            tl.set(rip, { x: p.cx, y: p.cy }, t);
            tl.fromTo(rip, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.04);
          };
          press(chipEl, 1.4, "#f02-rip-1", CHIP);
          tl.to("#f02-cursor", { ...at(ROW), duration: 0.5, ease: "power3.inOut" }, 1.6);
          press(rowEl[0], 2.15, "#f02-rip-2", ROW);
          tl.to("#f02-cursor", { x: ROW.cx + 200, y: ROW.cy + 260, opacity: 0, duration: 0.55, ease: "power2.in" }, 2.45);
          // Send, as the typing ends.
          tl.to(send, { scale: 0.86, duration: 0.07, ease: "power2.in" }, 3.85);
          tl.to(send, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 3.92);
          tl.set("#f02-rip-3", { x: SEND.cx, y: SEND.cy }, 3.85);
          tl.fromTo("#f02-rip-3", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.4, duration: 0.45, ease: "power2.out", immediateRender: false }, 3.88);

          // ── Camera on the window: keys [t, focusX, focusY, z, rx, ry] through a
          // monotone cubic, so it flows through keys and never overshoots.
          const KEYS = [
            [0.0, 960, 540, -900, 12, -16],
            [1.1, 1180, 745, 420, 2, -3], // the picker and the composer, close; frame stays inside the window
            [2.3, 1200, 745, 440, 1, -2],
            [3.0, 880, 840, 600, 0, 0], // the prompt, closer still
            [3.9, 900, 840, 640, 0, 0],
            [4.55, 900, 990, 1060, 0, 0], // through the composer
          ];
          const C = KEYS[0].length - 1;
          const slopes = [];
          for (let c = 1; c <= C; c++) {
            const n = KEYS.length;
            const d = [];
            for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
            const m = new Array(n).fill(0);
            for (let i = 1; i < n - 1; i++) {
              if (d[i - 1] * d[i] > 0) {
                const h0 = KEYS[i][0] - KEYS[i - 1][0];
                const h1 = KEYS[i + 1][0] - KEYS[i][0];
                const w1 = 2 * h1 + h0;
                const w2 = h1 + 2 * h0;
                m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
              }
            }
            slopes.push(m);
          }
          const camAt = (t) => {
            if (t <= KEYS[0][0]) return KEYS[0].slice(1);
            const last = KEYS[KEYS.length - 1];
            if (t >= last[0]) return last.slice(1);
            let i = 0;
            while (t > KEYS[i + 1][0]) i++;
            const h = KEYS[i + 1][0] - KEYS[i][0];
            const u = (t - KEYS[i][0]) / h;
            const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
            const h10 = u ** 3 - 2 * u ** 2 + u;
            const h01 = -2 * u ** 3 + 3 * u ** 2;
            const h11 = u ** 3 - u ** 2;
            const v = [];
            for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
            return v;
          };
          const clock = { t: 0 };
          const apply = () => {
            const [fx, fy, z, rx, ry] = camAt(clock.t);
            // Translate outside the rotations: x/y/z stay screen-aligned at any tilt.
            world.style.transform = `translate3d(${960 - fx}px, ${540 - fy}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          apply();
          tl.to(clock, { t: FILM, duration: FILM, ease: "none", onUpdate: apply }, 0);

          // ── The dive: the window rushes past, white takes the frame, the stream opens.
          tl.fromTo("#f02-win", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(14px)", duration: 0.4, ease: "power2.in", immediateRender: false }, 4.15);
          tl.fromTo("#f02-veil", { opacity: 0 }, { opacity: 0.85, duration: 0.25, ease: "power2.in", immediateRender: false }, 4.2);
          tl.to("#f02-veil", { opacity: 0, duration: 0.5, ease: "power2.out" }, 4.5);

          // Tokens: words of the task and its plan, laid out in depth (seeded, so
          // every render places them the same), flowing toward the lens.
          const WORDS = ["orders", "schema", "migration", "plan", "step 1", "backfill", "index", "foreign key", "rollback", "orders_v2", "lock", "batch", "verify", "Nemotron", "rename", "constraint", "dry run", "tokens", "test", "deploy"];
          let seed = 7;
          const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
          const layer = document.getElementById("f02-tokens");
          for (let i = 0; i < 64; i++) {
            const el = document.createElement("div");
            const w = WORDS[i % WORDS.length];
            el.className = "f02-tok" + (w === "Nemotron" ? " g" : "");
            el.textContent = w;
            const x = 80 + rnd() * 1760;
            const y = 60 + rnd() * 960;
            const z = -2600 + rnd() * 2400;
            el.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
            layer.appendChild(el);
          }
          tl.fromTo("#f02-stage-b", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.35);
          tl.fromTo("#f02-tokens", { z: -400 }, { z: 1100, duration: FILM - 4.35, ease: "power1.inOut", immediateRender: false }, 4.35);
          tl.to("#f02-stage-b", { opacity: 0.35, duration: 0.6, ease: "power2.out" }, 4.72);

          // ── The two lines, risen out of masks.
          // Words pop up out of a blur, one after another; the brand names
          // carry a gradient that sweeps across as they land.
          const pop = (sel, t) => {
            const ws = [...root.querySelectorAll(sel + " .f02-w")];
            gsap.set(ws, { yPercent: 120, scale: 0.86, opacity: 0, filter: "blur(10px)" });
            tl.to(ws, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "back.out(1.7)", stagger: 0.07 }, t);
            const gs = ws.filter((w) => w.classList.contains("f02-grad"));
            if (gs.length) tl.fromTo(gs, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.3, ease: "power2.inOut", stagger: 0.06, immediateRender: false }, t + 0.25);
          };
          pop("#f02-l1", 4.7);
          pop("#f02-l2", 5.85);
          // The camera eases in on the lines while they hold.
          tl.fromTo("#f02-lines", { scale: 0.97 }, { scale: 1.02, duration: FILM - 4.7, ease: "none", immediateRender: false }, 4.7);

          window.__timelines["f02-engine"] = tl;
        })();
      </script>
