      <script>
        (function () {
          const FILM = 10;
          const tl = gsap.timeline({ paused: true });
          const root = document.getElementById("f03-root");
          const win = document.getElementById("f03-win");
          const world = document.getElementById("f03-world");
          const world2 = document.getElementById("f03-world2");
          const stateEl = (id) => [...root.querySelectorAll(".ap-state")].find((n) => n.dataset.state === id);
          const R0 = stateEl("r0");
          const R1 = stateEl("r1");

          // ── A monotone-cubic camera over keys [t, ...channels].
          const makeCam = (KEYS) => {
            const C = KEYS[0].length - 1;
            const slopes = [];
            for (let c = 1; c <= C; c++) {
              const n = KEYS.length;
              const d = [];
              for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
              const m = new Array(n).fill(0);
              for (let i = 1; i < n - 1; i++) {
                if (d[i - 1] * d[i] > 0) {
                  const h0 = KEYS[i][0] - KEYS[i - 1][0];
                  const h1 = KEYS[i + 1][0] - KEYS[i][0];
                  const w1 = 2 * h1 + h0;
                  const w2 = h1 + 2 * h0;
                  m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
                }
              }
              slopes.push(m);
            }
            return (t) => {
              if (t <= KEYS[0][0]) return KEYS[0].slice(1);
              const last = KEYS[KEYS.length - 1];
              if (t >= last[0]) return last.slice(1);
              let i = 0;
              while (t > KEYS[i + 1][0]) i++;
              const h = KEYS[i + 1][0] - KEYS[i][0];
              const u = (t - KEYS[i][0]) / h;
              const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
              const h10 = u ** 3 - 2 * u ** 2 + u;
              const h01 = -2 * u ** 3 + 3 * u ** 2;
              const h11 = u ** 3 - u ** 2;
              const v = [];
              for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
              return v;
            };
          };

          // ── Measure the captured settings once, at rest.
          world.style.transform = "none";
          const W0 = win.getBoundingClientRect();
          const inWin = (el) => {
            const r = el.getBoundingClientRect();
            return { x: r.left - W0.left, y: r.top - W0.top, w: r.width, h: r.height, cx: r.left - W0.left + r.width / 2, cy: r.top - W0.top + r.height / 2 };
          };
          R0.style.opacity = "1";
          R1.style.opacity = "1";
          // The "Match the model to the task" switch: the last switch in the panel.
          const switches = [...R1.querySelectorAll('[role="switch"], input[type="checkbox"]')].map((i) => (i.tagName === "INPUT" ? i.closest("span") || i.parentElement : i)).sort((a, b) => inWin(a).y - inWin(b).y);
          const sw = switches[switches.length - 1];
          const SW = inWin(sw);
          // The three tier pickers, below the switch, in order.
          const tierBoxes = [/^Nemotron 3 Nano$/, /^Nemotron 3 Super$/, /^Nemotron 3 Ultra 550B$/].map((re) => {
            const leaf = [...R1.querySelectorAll("*")].filter((el) => el.childElementCount === 0 && re.test((el.textContent || "").trim()) && inWin(el).y > SW.y + 20).sort((a, b) => inWin(a).y - inWin(b).y)[0];
            return leaf ? leaf.closest("button") || leaf.parentElement.parentElement : null;
          });
          R0.style.opacity = "";
          R1.style.opacity = "";

          // ── Part A: the real panel. Off, then the cursor turns matching on and
          // the tiers fill in, one model each.
          tl.set(R0, { opacity: 1 }, 0);
          tl.set(R0, { opacity: 0 }, 0.92);
          tl.set(R1, { opacity: 1 }, 0.92);
          tierBoxes.forEach((b, i) => {
            if (!b) return;
            gsap.set(b, { opacity: 0, x: -14 });
            tl.to(b, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.25 + i * 0.3);
          });
          const TIP = 5;
          tl.set("#f03-cursor", { opacity: 1, x: SW.cx + 240, y: SW.cy + 160 }, 0.15);
          tl.to("#f03-cursor", { x: SW.cx - TIP, y: SW.cy - TIP, duration: 0.65, ease: "power3.inOut" }, 0.15);
          tl.to("#f03-cursor", { scale: 0.88, duration: 0.07, ease: "power2.in" }, 0.9);
          tl.to("#f03-cursor", { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 0.97);
          tl.set("#f03-rip", { x: SW.cx, y: SW.cy }, 0.9);
          tl.fromTo("#f03-rip", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out", immediateRender: false }, 0.94);
          tl.to("#f03-cursor", { x: SW.cx + 160, y: SW.cy + 220, opacity: 0, duration: 0.5, ease: "power2.in" }, 1.3);

          // Camera on the window: [t, focusX, focusY, z, rx, ry].
          const camA = makeCam([
            [0.0, 1150, 640, 430, 3, -6],
            [1.4, 1150, 650, 520, 1, -2],
            [2.8, 1150, 660, 540, 0, 0],
            [3.6, 1150, 700, -300, 62, 0], // the panel lays down into the floor
          ]);
          const clockA = { t: 0 };
          const applyA = () => {
            const [fx, fy, z, rx, ry] = camA(clockA.t);
            world.style.transform = `translate3d(${960 - fx}px, ${540 - fy}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          applyA();
          tl.to(clockA, { t: 3.6, duration: 3.6, ease: "none", onUpdate: applyA }, 0);
          tl.fromTo("#f03-stage-a", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 3.15);
          tl.fromTo("#f03-stage-b", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, 3.15);

          // ── Part B: the router. Each task slides in, is graded, and its pill
          // rides a lit path to the model that takes it. The hard one goes to Ultra.
          const SEG = ["#f03-s1", "#f03-s2", "#f03-s3"];
          const route = (k, level, t0, travel) => {
            const task = "#f03-t-" + k;
            const pill = "#f03-pl-" + k;
            const path = document.getElementById("f03-p-" + k);
            const len = path.getTotalLength();
            const green = k === "h";
            // The task arrives from the left, then is drawn into the router.
            tl.fromTo(task, { x: -520, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, t0);
            tl.to(task, { x: 560, y: 40, scale: 0.25, opacity: 0, duration: 0.45, ease: "power3.in" }, t0 + 0.6);
            tl.to("#f03-router", { scale: 1.08, duration: 0.18, ease: "power2.out" }, t0 + 1.0);
            tl.to("#f03-router", { scale: 1, duration: 0.3, ease: "back.out(2)" }, t0 + 1.18);
            // The grade fills the meter, segment by segment.
            for (let i = 0; i < 3; i++) {
              const on = i < level;
              tl.to(SEG[i] + " i", { backgroundColor: on ? (green ? "#76b900" : "#111111") : "#ececec", duration: 0.12, ease: "none" }, t0 + 1.0 + i * 0.08);
              tl.to(SEG[i], { color: i === level - 1 ? "#111111" : "#9a9a9a", duration: 0.12 }, t0 + 1.0 + i * 0.08);
            }
            // The path lights and the pill rides it.
            gsap.set(path, { strokeDasharray: len, strokeDashoffset: 0 });
            tl.set(path, { attr: { class: green ? "lit g" : "lit" }, strokeDashoffset: len }, t0 + 1.2);
            tl.to(path, { strokeDashoffset: 0, duration: travel, ease: "power2.inOut" }, t0 + 1.2);
            const p = { d: 0 };
            const place = () => {
              const pt = path.getPointAtLength(p.d * len);
              gsap.set(pill, { x: pt.x, y: pt.y });
            };
            tl.set(pill, { opacity: 1 }, t0 + 1.2);
            tl.fromTo(p, { d: 0 }, { d: 1, duration: travel, ease: "power2.inOut", immediateRender: false, onUpdate: place }, t0 + 1.2);
            tl.to(pill, { opacity: 0, scale: 0.6, duration: 0.2 }, t0 + 1.2 + travel);
            const model = "#f03-m-" + k;
            tl.to(model, { scale: 1.05, duration: 0.2, ease: "power2.out" }, t0 + 1.2 + travel);
            tl.to(model, { scale: 1, duration: 0.35, ease: "back.out(2)" }, t0 + 1.4 + travel);
            tl.fromTo(model + " .f03-done", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false }, t0 + 1.3 + travel);
          };
          gsap.set(".f03-pill", { x: 960, y: 640 });
          route("e", 1, 3.35, 0.45);
          route("m", 2, 4.1, 0.55);
          route("h", 3, 4.85, 0.8);
          tl.to("#f03-m-h", { boxShadow: "0 0 0 3px #76b900, 0 24px 60px rgba(118, 185, 0, 0.25)", duration: 0.4, ease: "power2.out" }, 5.95);
          tl.fromTo("#f03-ring", { rotation: 0 }, { rotation: 140, duration: FILM - 3.15, ease: "none", immediateRender: false }, 3.15);

          // Camera: a slow orbit across the diagram, then in on Ultra for the line.
          const camB = makeCam([
            [3.15, 0, 40, -520, 8, -14],

            [5.9, -60, -20, -160, 2, 0],

          const clockB = { t: 3.15 };
          const applyB = () => {

            world2.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;

          applyB();
          tl.to(clockB, { t: FILM, duration: FILM - 3.15, ease: "none", onUpdate: applyB }, 3.15);

          gsap.set("#f03-l2", { opacity: 0, y: 26, filter: "blur(8px)" });

          tl.fromTo("#f03-l1 .f03-grad", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.3, ease: "power2.inOut", immediateRender: false }, 6.9);
          tl.to("#f03-l2", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 7.5);

          window.__timelines["f03-router"] = tl;
        })();
