          const HOT = 13; // e14: Thu's "Failed" cell
          const hotCell = inB(TARGETS[HOT]);
          const dlgEl = document.getElementById("f06-dlg");
          const allowBtn = [...dlgEl.querySelectorAll("button")].find((x) => (x.textContent || "").trim() === "Allow");
          const D0 = dlgEl.getBoundingClientRect();
          const AR = allowBtn.getBoundingClientRect();
          flat.forEach((w, i) => (w.style.transform = saved[i]));
          space.style.transform = "";
          // The dialog sits 160px toward the lens; its Allow button, seen from the camera's
          // resting pose, lands close to its flat position scaled about the view centre.
          // Your cursor lives on the dialog's own plane, in its coordinates.
          const ALLOW = { cx: AR.left - D0.left + AR.width / 2, cy: AR.top - D0.top + AR.height / 2 };
          const FAILED = at(document.getElementById("f06-chip-failed"));

          // ── A: the agent reaches the password field and stops.
          const TIP = 5;
          const agent = (p, t, d) => {
            tl.to("#f06-cur", { x: p.cx - TIP, y: p.cy - TIP, duration: d, ease: "power3.inOut" }, t);
            tl.to("#f06-tag", { x: p.cx + 22, y: p.cy + 22, duration: d, ease: "power3.inOut" }, t);
          };
          const press = (sel, p, t, rip) => {
            tl.to(sel, { scale: 0.88, duration: 0.07, ease: "power2.in" }, t);
            tl.to(sel, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t + 0.07);
            tl.set(rip, { x: p.cx, y: p.cy }, t);
            tl.fromTo(rip, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.04);
          };
          gsap.set("#f06-cur", { x: PW.cx + 260, y: PW.cy + 220 });
          gsap.set("#f06-tag", { x: PW.cx + 282, y: PW.cy + 242 });
          tl.to(["#f06-cur", "#f06-tag"], { opacity: 1, duration: 0.2 }, 0.25);
          agent(PW, 0.3, 0.55);
          tl.to("#f06-pw", { borderColor: "#111111", boxShadow: "0 0 0 4px rgba(17, 17, 17, 0.08)", duration: 0.2 }, 0.85);

          // The real approval floats up in front of the page; you allow it.
          tl.fromTo("#f06-dlgpos", { y: 40, scale: 0.94 }, { y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, 1.0);
          gsap.set("#f06-you", { x: ALLOW.cx - 140, y: ALLOW.cy + 60 });
          tl.to("#f06-you", { opacity: 1, duration: 0.2 }, 1.45);
          tl.to("#f06-you", { x: ALLOW.cx - TIP, y: ALLOW.cy - TIP, duration: 0.6, ease: "power3.inOut" }, 1.55);
          press(["#f06-you", allowBtn], ALLOW, 2.2, "#f06-rip-y");
          tl.fromTo(dlgEl, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 1.0);
          tl.to("#f06-dlgpos", { y: -30, scale: 0.96, duration: 0.35, ease: "power2.in" }, 2.35);
          tl.to(dlgEl, { opacity: 0, duration: 0.35, ease: "power2.in" }, 2.35);
          tl.to("#f06-you", { opacity: 0, duration: 0.25 }, 2.4);

          // The password goes in as dots, straight from the vault.
          const dots = document.getElementById("f06-dots");
          const dp = { n: 0 };
          tl.fromTo(dp, { n: 0 }, { n: 14, duration: 0.6, ease: "none", immediateRender: false, onUpdate: () => (dots.textContent = "•".repeat(Math.round(dp.n))) }, 2.45);
          tl.fromTo("#f06-vaulted", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.95);
          agent(SIGNIN, 2.85, 0.35);
          press(["#f06-cur", "#f06-signin"], SIGNIN, 3.25, "#f06-rip-2");
          // Signed in: the dashboard comes up.
          tl.to("#f06-login", { opacity: 0, duration: 0.3, ease: "power2.out" }, 3.4);
          tl.to("#f06-dash", { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.45);
          tl.set("#f06-u1", { opacity: 0 }, 3.45);
          tl.set("#f06-u2", { opacity: 1 }, 3.45);
          agent(FAILED, 3.55, 0.35);
          press(["#f06-cur", "#f06-chip-failed"], FAILED, 3.95, "#f06-rip-3");
          tl.to("#f06-chip-failed", { backgroundColor: "#111111", color: "#ffffff", borderColor: "#111111", duration: 0.15 }, 4.0);
          tl.to(".f06-ok", { opacity: 0.18, duration: 0.3, ease: "power2.out" }, 4.05);
          tl.to(["#f06-cur", "#f06-tag"], { opacity: 0, duration: 0.2 }, 4.3);

          // ── B: DIP snapshots the window. Every control gets a box and an id;
          // it acts on one by id.
          gsap.set(boxes, { opacity: 0, scale: 1.15 });
          tl.to(boxes, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", stagger: 0.05 }, 5.15);
          const hot = document.createElement("div");
          hot.className = "f06-box hot";
          Object.assign(hot.style, { left: hotCell.x + 1 + "px", top: hotCell.y + 1 + "px", width: hotCell.w - 2 + "px", height: hotCell.h - 2 + "px" });
          boxesEl.appendChild(hot);
          tl.fromTo(hot, { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 5.95);
          tl.to(boxes.filter((_, i) => i !== HOT), { opacity: 0.25, duration: 0.3 }, 5.95);
          const call = document.getElementById("f06-call");
          gsap.set(call, { x: hotCell.x + hotCell.w + 26, y: hotCell.y - 8 });
          tl.fromTo(call, { opacity: 0, x: hotCell.x + hotCell.w + 6 }, { opacity: 1, x: hotCell.x + hotCell.w + 26, duration: 0.35, ease: "power3.out", immediateRender: false }, 6.0);
          const typed = document.getElementById("f06-typed");
          const SH = inB(document.getElementById("f06-sheet"));
          gsap.set(typed, { x: hotCell.x - SH.x, y: hotCell.y - SH.y, width: hotCell.w });
          tl.set(typed, { opacity: 1 }, 6.3);

          // ── Headlines.
          const pop = (sel, t, out) => {
            const ws = [...root.querySelectorAll(sel + " .f06-w")];
            gsap.set(ws, { yPercent: 120, scale: 0.86, opacity: 0, filter: "blur(10px)" });
            tl.to(ws, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "back.out(1.7)", stagger: 0.05 }, t);
            if (out) tl.to(ws, { opacity: 0, yPercent: -60, filter: "blur(8px)", duration: 0.3, ease: "power2.in", stagger: 0.02 }, out);
          };
          pop("#f06-h1", 0.15, 2.3);
          pop("#f06-h2", 2.5, 4.35);
          pop("#f06-h3", 4.85, 7.75);
          tl.fromTo("#f06-sub", { opacity: 0, y: 16, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: false }, 5.6);
          tl.to("#f06-sub", { opacity: 0, duration: 0.3 }, 7.75);

          // ── Camera: [t, x, y, z, rx, ry]. One whip pan from the browser to the desktop.
          const KEYS = [
            [0.0, 0, 40, -700, 6, -8],
            [1.0, 0, 0, -120, 2, -2],
            [4.35, 0, 0, -60, 1, 0],
            [4.9, -2200, 0, -140, 2, 0],
            [7.6, -2200, 0, 40, 1, 0],
            [8.2, -2200, -900, -700, 12, 0],
          ];
          const C = KEYS[0].length - 1;
          const slopes = [];
          for (let c = 1; c <= C; c++) {
            const n = KEYS.length;
            const d = [];
            for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
            const m = new Array(n).fill(0);
            for (let i = 1; i < n - 1; i++) {
              if (d[i - 1] * d[i] > 0) {
                const h0 = KEYS[i][0] - KEYS[i - 1][0];
                const h1 = KEYS[i + 1][0] - KEYS[i][0];
                const w1 = 2 * h1 + h0;
                const w2 = h1 + 2 * h0;
                m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
              }
            }
            slopes.push(m);
          }
          const camAt = (t) => {
            if (t <= KEYS[0][0]) return KEYS[0].slice(1);
            const last = KEYS[KEYS.length - 1];
            if (t >= last[0]) return last.slice(1);
            let i = 0;
            while (t > KEYS[i + 1][0]) i++;
            const h = KEYS[i + 1][0] - KEYS[i][0];
            const u = (t - KEYS[i][0]) / h;
            const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
            const h10 = u ** 3 - 2 * u ** 2 + u;
            const h01 = -2 * u ** 3 + 3 * u ** 2;
            const h11 = u ** 3 - u ** 2;
            const v = [];
            for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
            return v;
          };
          const clock = { t: 0 };
          const apply = () => {
            const [x, y, z, rx, ry] = camAt(clock.t);
            space.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          apply();
          tl.to(clock, { t: FILM, duration: FILM, ease: "none", onUpdate: apply }, 0);
          tl.to("#f06-stage", { filter: "blur(7px)", duration: 0.22, ease: "power2.in" }, 4.4);
          tl.to("#f06-stage", { filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 4.62);
          tl.to("#f06-stage", { opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power2.in" }, 7.75);

          window.__timelines["f06-world"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
