      <script>
        (function () {
          const FILM = 8.4;
          const tl = gsap.timeline({ paused: true });
          const root = document.getElementById("f08-root");
          const space = document.getElementById("f08-space");
          const screen = document.getElementById("f08-screen");
          const st = (k) => [...root.querySelectorAll(".ap-state")].find((e) => e.dataset.state === k);

          // The outermost element whose text is exactly the smallest match of
          // `re` inside `scope`: a whole row, card or bubble, found by its words.
          const box = (scope, re) => {
            const hits = [...scope.querySelectorAll("*")].filter((e) => re.test(e.textContent || ""));
            if (!hits.length) return null;
            let el = hits.sort((a, b) => a.textContent.length - b.textContent.length)[0];
            const text = el.textContent.trim();
            while (el.parentElement && el.parentElement !== scope && el.parentElement.textContent.trim() === text) el = el.parentElement;
            return el;
          };
          // Rects in the screen's own (unscaled-on-screen) pixels, measured flat.
          space.style.transform = "none";
          const S0 = screen.getBoundingClientRect();
          const at = (el) => {
            const r = el.getBoundingClientRect();
            return { x: r.left - S0.left, y: r.top - S0.top, w: r.width, h: r.height, cx: r.left - S0.left + r.width / 2, cy: r.top - S0.top + r.height / 2 };
          };

          const b1 = st("b1");
          const b2 = st("b2");
          const b4 = st("b4");
          const b3 = st("b3");
          const ask = box(b1, /^Build me a panel that shows every agent at work$/);
          const steps = [/^guide$/, /^Wrotemod\.json$/, /^Wrotepanel\.html$/].map((re) => box(b1, re));
          const reply = box(b1, /^The Agent board is built/);
          // The Agent board's switch: the first in the list, above the Checklist's.
          const SWITCH = at(b2.querySelector('[role="switch"]'));
          const dlg = box(b4, /^Turn on Agent board\?/);
          const dlgPaper = dlg ? dlg.closest('[role="dialog"]') || dlg.parentElement : null;
          const turnOn = [...b4.querySelectorAll("button")].find((b) => (b.textContent || "").trim() === "Turn on");
          const TURNON = at(turnOn);
          const flips = [...b3.querySelectorAll(".viv-flip")];
          const boardEl = flips.find((f) => at(f).x > 900);
          const checkEl = flips.find((f) => f !== boardEl);
          const BOARD = at(boardEl);
          const CHECK = at(checkEl);
          const tab = box(b3, /^Agent board$/);
          const q2 = box(b3, /^What's left before the release\?$/);
          space.style.transform = "";

          // ── 1. The ask, the steps, the reply: the chat builds as it happened.
          tl.set(b1, { opacity: 1 }, 0);
          const rise = (el, t, d = 0.45) => {
            if (!el) return;
            gsap.set(el, { opacity: 0, y: 18 });
            tl.to(el, { opacity: 1, y: 0, duration: d, ease: "expo.out" }, t);
          };
          rise(ask, 0.35);
          steps.forEach((el, i) => rise(el, 0.95 + i * 0.25));
          rise(reply, 1.75, 0.6);

          // ── 2. Settings → Mods opens; the cursor turns the new mod on.
          const cur = "#f08-cur";
          const TIP = 6;
          const move = (p, t, d) => tl.to(cur, { x: p.cx - TIP, y: p.cy - TIP, duration: d, ease: "power3.inOut" }, t);
          const press = (p, t, rip, target) => {
            tl.to([cur].concat(target ? [target] : []), { scale: 0.86, duration: 0.07, ease: "power2.in" }, t);
            tl.to([cur].concat(target ? [target] : []), { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t + 0.07);
            tl.set(rip, { x: p.cx, y: p.cy }, t);
            tl.fromTo(rip, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.04);
          };
          tl.to(b2, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.4);
          const settingsCard = box(b2, /^SettingsACCOUNT/i) || null;
          if (settingsCard) tl.fromTo(settingsCard, { scale: 0.95, y: 24 }, { scale: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, 2.4);
          gsap.set(cur, { x: SWITCH.cx + 180, y: SWITCH.cy + 260 });
          tl.to(cur, { opacity: 1, duration: 0.2 }, 2.6);
          move(SWITCH, 2.65, 0.65);
          press(SWITCH, 3.35, "#f08-rip-1");
          // It asks first: the real consent dialog.
          tl.set(b4, { opacity: 1 }, 3.42);
          tl.set(b2, { opacity: 0 }, 3.42);
          if (dlgPaper) tl.fromTo(dlgPaper, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)", immediateRender: false }, 3.42);
          move(TURNON, 3.6, 0.55);
          press(TURNON, 4.2, "#f08-rip-2", turnOn);

          // ── 3. On: the Agent board slides into the dock, its cards live;
          // later a checklist the Checklist mod draws lands in the chat.
          tl.to(b4, { opacity: 0, duration: 0.25, ease: "power2.in" }, 4.35);
          tl.to(b3, { opacity: 1, duration: 0.25, ease: "power2.out" }, 4.35);
          tl.to(cur, { opacity: 0, duration: 0.2 }, 4.4);
          if (tab) tl.fromTo(tab, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, 4.45);
          if (boardEl) tl.fromTo(boardEl, { x: 140, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out", immediateRender: false }, 4.5);
          rise(q2, 5.55);
          if (checkEl) tl.fromTo(checkEl, { scale: 0.85, y: 30, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.6)", immediateRender: false }, 5.9);
          rise(box(b3, /^Three things, one done:$/), 5.8);

          // ── Headlines.
          const pop = (sel, t, out) => {
            const ws = [...root.querySelectorAll(sel + " .f08-w")];
            gsap.set(ws, { yPercent: 120, scale: 0.86, opacity: 0, filter: "blur(10px)" });
            tl.to(ws, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "back.out(1.7)", stagger: 0.05 }, t);
            if (out) tl.to(ws, { opacity: 0, yPercent: -60, filter: "blur(8px)", duration: 0.3, ease: "power2.in", stagger: 0.02 }, out);
          };
          pop("#f08-h1", 0.2, 2.35);
          pop("#f08-h2", 2.6, 4.45);
          pop("#f08-h3", 6.4);
          tl.fromTo("#f08-sub", { opacity: 0, y: 16, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: false }, 6.8);

          // ── Camera: [t, focusX, focusY, z, rx, ry], focus in the space's
          // pixels, shown at y 600, under the headlines. Arrives from below-left,
          // leans into the chat, the switch, the dialog, follows the board into
          // the dock and the checklist, then settles back for the title.
          const SX = 269;
          const SY = 236;
          const P = (r, dx = 0, dy = 0) => [SX + r.cx + dx, SY + r.cy + dy];
          const KEYS = [
            [0.0, 960, 700, -700, 10, -10],
            [1.0, 930, 520, 260, 3, -2],
            [2.2, 930, 500, 420, 1, 0],
            [2.6, 960, 600, 120, 0, 0],
            [3.2, ...P(SWITCH, -90, 40), 300, 0, 2],
            [3.9, ...P(TURNON, -110, -10), 320, 0, 0],
            [4.6, 1120, 580, 100, 0, -3],
            [5.4, SX + BOARD.cx - 40, SY + BOARD.y + 150, 300, 0, -4],
            [6.2, ...P(CHECK, 40, -20), 300, 0, 3],
            [7.0, 960, 640, -80, 1, 0],
            [8.4, 960, 630, -140, 2, 0],
          ];
          const C = KEYS[0].length - 1;
          const slopes = [];
          for (let c = 1; c <= C; c++) {
            const n = KEYS.length;
            const d = [];
            for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
            const m = new Array(n).fill(0);
            for (let i = 1; i < n - 1; i++) {
              if (d[i - 1] * d[i] > 0) {
                const h0 = KEYS[i][0] - KEYS[i - 1][0];
                const h1 = KEYS[i + 1][0] - KEYS[i][0];
                const w1 = 2 * h1 + h0;
                const w2 = h1 + 2 * h0;
                m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
              }
            }
            slopes.push(m);
          }
          const camAt = (t) => {
            if (t <= KEYS[0][0]) return KEYS[0].slice(1);
            const last = KEYS[KEYS.length - 1];
            if (t >= last[0]) return last.slice(1);
            let i = 0;
            while (t > KEYS[i + 1][0]) i++;
            const h = KEYS[i + 1][0] - KEYS[i][0];
            const u = (t - KEYS[i][0]) / h;
            const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
            const h10 = u ** 3 - 2 * u ** 2 + u;
            const h01 = -2 * u ** 3 + 3 * u ** 2;
            const h11 = u ** 3 - u ** 2;
            const v = [];
            for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
            return v;
          };
          const clock = { t: 0 };
          const apply = () => {
            const [fx, fy, z, rx, ry] = camAt(clock.t);
            space.style.transform = `translate3d(${960 - fx}px, ${540 + 60 - fy}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          apply();
          tl.to(clock, { t: FILM, duration: FILM, ease: "none", onUpdate: apply }, 0);
          tl.to(["#f08-stage", "#f08-veil", "#f08-heads", "#f08-sub"], { opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power2.in" }, 8.1);

          window.__timelines["f08-mods"] = tl;
        })();
      </script>
