      <script>
        (function () {
          const FILM = 7.2;
          const NOTCH_AT = 0.95; // the notch's own clock starts as it drops
          const tl = gsap.timeline({ paused: true });
          const root = document.getElementById("f07-root");
          const space = document.getElementById("f07-space");

          // ── The notch's frames, stepped by the film's clock.
          const frames = [...root.querySelectorAll(".f07-f")];
          let shown = -1;
          const fr = { t: 0 };
          const showFrame = () => {
            const i = Math.min(frames.length - 1, Math.max(0, Math.floor(fr.t * 30)));
            if (i === shown) return;
            if (shown >= 0) frames[shown].style.visibility = "hidden";
            frames[i].style.visibility = "visible";
            shown = i;
          };
          showFrame();
          gsap.set("#f07-notch", { opacity: 0 });
          tl.fromTo("#f07-notch", { opacity: 0, scaleY: 0.2, scaleX: 0.6 }, { opacity: 1, scaleY: 1, scaleX: 1, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, NOTCH_AT);
          tl.fromTo(fr, { t: 0 }, { t: frames.length / 30, duration: frames.length / 30, ease: "none", immediateRender: false, onUpdate: showFrame }, NOTCH_AT);
          tl.to("#f07-dim", { opacity: 1, duration: 0.5 }, NOTCH_AT);

          // ── The chord: three keys pop up and press together; the notch answers.
          const keys = [...root.querySelectorAll(".f07-key")];
          gsap.set(keys, { opacity: 0, y: 30, scale: 0.8 });
          tl.to(keys, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.07 }, 0.2);
          tl.to(keys, { y: 6, boxShadow: "0 0 0 1px rgba(17,17,17,0.14), 0 0 0 rgba(17,17,17,0.12), 0 6px 14px rgba(17,17,17,0.08)", backgroundColor: "#f2f2f2", duration: 0.1, ease: "power2.in" }, 0.75);
          const pop = (sel, t, out) => {
            const ws = [...root.querySelectorAll(sel + " .f07-w")];
            gsap.set(ws, { yPercent: 120, scale: 0.86, opacity: 0, filter: "blur(10px)" });
            tl.to(ws, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "back.out(1.7)", stagger: 0.06 }, t);
            if (out) tl.to(ws, { opacity: 0, yPercent: -60, filter: "blur(8px)", duration: 0.3, ease: "power2.in", stagger: 0.02 }, out);
          };
          pop("#f07-h1", 0.3, 1.45);
          tl.to(keys, { opacity: 0, y: 20, filter: "blur(6px)", duration: 0.3, ease: "power2.in", stagger: 0.03 }, 1.45);
          tl.to("#f07-fade", { opacity: 1, duration: 0.4 }, 5.6);
          pop("#f07-h2", 5.75);

          // ── Camera: [t, focusX, focusY, z, rx, ry]. Tilts up into the screen,
          // pushes in to the notch while it listens and answers, then pulls back.
          // The notch's centre on the screen plane: (960, 108 + ~40).
          const KEYS = [
            [0.0, 960, 760, -700, -22, 0],
            [0.9, 960, 560, -160, -3, 0],
            [1.6, 960, 150, 880, 0, 0],
            [3.3, 960, 160, 900, 0, -1],
            [5.4, 960, 172, 910, 0, 1],
            [6.2, 960, 380, 120, 4, 0],
            [7.2, 960, 400, 60, 6, 0],
          ];
          const C = KEYS[0].length - 1;
          const slopes = [];
          for (let c = 1; c <= C; c++) {
            const n = KEYS.length;
            const d = [];
            for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
            const m = new Array(n).fill(0);
            for (let i = 1; i < n - 1; i++) {
              if (d[i - 1] * d[i] > 0) {
                const h0 = KEYS[i][0] - KEYS[i - 1][0];
                const h1 = KEYS[i + 1][0] - KEYS[i][0];
                const w1 = 2 * h1 + h0;
                const w2 = h1 + 2 * h0;
                m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
              }
            }
            slopes.push(m);
          }
          const camAt = (t) => {
            if (t <= KEYS[0][0]) return KEYS[0].slice(1);
            const last = KEYS[KEYS.length - 1];
            if (t >= last[0]) return last.slice(1);
            let i = 0;
            while (t > KEYS[i + 1][0]) i++;
            const h = KEYS[i + 1][0] - KEYS[i][0];
            const u = (t - KEYS[i][0]) / h;
            const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
            const h10 = u ** 3 - 2 * u ** 2 + u;
            const h01 = -2 * u ** 3 + 3 * u ** 2;
            const h11 = u ** 3 - u ** 2;
            const v = [];
            for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
            return v;
          };
          const clock = { t: 0 };
          const apply = () => {
            const [fx, fy, z, rx, ry] = camAt(clock.t);
            space.style.transform = `translate3d(${960 - fx}px, ${540 - fy}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          apply();
          tl.to(clock, { t: FILM, duration: FILM, ease: "none", onUpdate: apply }, 0);
          tl.to(["#f07-stage", "#f07-end", "#f07-fade"], { opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power2.in" }, 6.75);

          window.__timelines["f07-instant"] = tl;
        })();
      </script>
    </template>
  </body>
