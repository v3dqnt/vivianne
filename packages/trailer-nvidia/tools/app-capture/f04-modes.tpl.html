        <audio id="f04-sfx-t2" data-hf-media-start-basis="local" src="assets/sfx/whoosh-short.mp3" data-start="3.6" data-duration="0.57" data-track-index="82" data-volume="0.55"></audio>

        <audio id="f04-sfx-p2" data-hf-media-start-basis="local" src="assets/sfx/click-soft.mp3" data-start="2.55" data-duration="0.37" data-track-index="84" data-volume="0.35"></audio>

        <audio id="f04-sfx-dive" data-hf-media-start-basis="local" src="assets/sfx/whoosh-cinematic.mp3" data-start="4.85" data-duration="1.15" data-track-index="86" data-volume="0.4"></audio>

      <script>
        (function () {
          const FILM = 6;
          const tl = gsap.timeline({ paused: true });
          const root = document.getElementById("f04-root");
          const world = document.getElementById("f04-world");
          const prism = document.getElementById("f04-prism");
          const stateEl = (id) => [...root.querySelectorAll(".ap-state")].find((n) => n.dataset.state === id);
          const S = [stateEl("w1"), stateEl("w2"), stateEl("w3")];

          // ── Measure the faces flat, once, with every 3D transform off.
          const faces = [...root.querySelectorAll(".f04-face")];
          const saved = faces.map((f) => f.style.transform);
          faces.forEach((f) => (f.style.transform = "none"));
          world.style.transform = "none";
          const rel = (el, face) => {
            const a = el.getBoundingClientRect();
            const b = face.getBoundingClientRect();
            return { x: a.left - b.left, y: a.top - b.top, w: a.width, h: a.height };
          };
          // A row: the text's nearest ancestor that looks like a list row.
          const rowOf = (st, text) => {
            const leaf = [...st.querySelectorAll("*")].find((el) => (el.textContent || "").trim() === text && [...el.children].every((c) => (c.textContent || "").trim() !== text));
            if (!leaf) return null;
            let el = leaf;
            while (el.parentElement && el.parentElement !== st) {
              const r = el.parentElement.getBoundingClientRect();
              if (r.height > 96 || r.width > 1100) break;
              el = el.parentElement;
            }
            return el;
          };
          const ROWS = [
            ["Database migration", "Refund webhooks", "Rate limits", "Plan the database migration for orders", "Read 1 file · 1 search"],
            ["Everyone", "Reviewer", "QA", "Release", "Heading out. @everyone get the refunds PR merged tonight.", "Reviewed #88. One nit, fixed it. Approved.", "Full e2e on staging: 132 passed, refunds included.", "Merging after the nightly build at 02:00."],
            ["Mira", "Writer", "Designer", "Tester", "Add an employee", "Ship 1.9 by Friday. You run it."],
          ].map((list, i) => list.map((t) => rowOf(S[i], t)).filter(Boolean));
          const MIRA = rel(rowOf(S[2], "Mira"), faces[2]);
          faces.forEach((f, i) => (f.style.transform = saved[i]));
          world.style.transform = "";

          // ── Rows rise in, 0.08s apart, as each face turns to the lens.
          ROWS.forEach((rows) => gsap.set(rows, { opacity: 0, y: 22 }));
          const rise = (rows, t) => tl.to(rows, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, t);
          rise(ROWS[0], 0.55);
          rise(ROWS[1], 2.15);
          rise(ROWS[2], 3.95);

          // ── The prism turns a face at a time.
          tl.fromTo(prism, { rotationY: 0 }, { rotationY: -120, duration: 0.8, ease: "power3.inOut", immediateRender: false }, 1.8);
          tl.to(prism, { rotationY: -240, duration: 0.8, ease: "power3.inOut" }, 3.6);

          // ── Headlines: each rises in, and leaves upward for the next.
          gsap.set(["#f04-h1", "#f04-h2", "#f04-h3"], { yPercent: 110 });
          tl.to("#f04-h1", { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.45);
          tl.to("#f04-h1", { yPercent: -110, duration: 0.45, ease: "power3.in" }, 1.75);
          tl.to("#f04-h2", { yPercent: 0, duration: 0.7, ease: "expo.out" }, 2.2);
          tl.to("#f04-h2", { yPercent: -110, duration: 0.45, ease: "power3.in" }, 3.55);
          tl.to("#f04-h3", { yPercent: 0, duration: 0.7, ease: "expo.out" }, 4.0);
          tl.to("#f04-h3", { yPercent: -110, duration: 0.4, ease: "power3.in" }, 5.15);

          // ── Camera: keys [t, x, y, z, rx, ry] through a monotone cubic. It comes
          // in from far and low, breathes out on each turn, then flies into Mira.
          // Mira on the front face: the face's top-left sits at (320, 200).
          const mx = 320 + MIRA.x + MIRA.w / 2;
          const my = 200 + MIRA.y + MIRA.h / 2;
          // The front face sits 370px toward the lens, so the camera rests at
          // -615: the face reads at ~0.88 scale, clear of the headline.
          const ex = 960 - mx;
          const ey = 583 - my;
          const KEYS = [
            [0.0, 0, 160, -2100, 18, 26],
            [1.2, 0, 0, -640, 4, 0],
            [1.8, 0, 0, -650, 3, 0],
            [2.2, 0, 20, -980, 7, -5],
            [2.75, 0, 0, -630, 3, 0],
            [3.6, 0, 0, -640, 3, 0],
            [4.0, 0, 20, -980, 7, 5],
            [4.55, 0, 0, -620, 2, 0],
            [4.95, 0, 0, -600, 1, 0],
            [5.55, ex * 0.85, ey * 0.85, 300, 0, 0],
            [6.0, ex, ey, 1250, 0, 0],
          ];
          const C = KEYS[0].length - 1;
          const slopes = [];
          for (let c = 1; c <= C; c++) {
            const n = KEYS.length;
            const d = [];
            for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
            const m = new Array(n).fill(0);
            for (let i = 1; i < n - 1; i++) {
              if (d[i - 1] * d[i] > 0) {
                const h0 = KEYS[i][0] - KEYS[i - 1][0];
                const h1 = KEYS[i + 1][0] - KEYS[i][0];
                const w1 = 2 * h1 + h0;
                const w2 = h1 + 2 * h0;
                m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
              }
            }
            slopes.push(m);
          }
          const camAt = (t) => {
            if (t <= KEYS[0][0]) return KEYS[0].slice(1);
            const last = KEYS[KEYS.length - 1];
            if (t >= last[0]) return last.slice(1);
            let i = 0;
            while (t > KEYS[i + 1][0]) i++;
            const h = KEYS[i + 1][0] - KEYS[i][0];
            const u = (t - KEYS[i][0]) / h;
            const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
            const h10 = u ** 3 - 2 * u ** 2 + u;
            const h01 = -2 * u ** 3 + 3 * u ** 2;
            const h11 = u ** 3 - u ** 2;
            const v = [];
            for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
            return v;
          };
          const clock = { t: 0 };
          const apply = () => {
            const [x, y, z, rx, ry] = camAt(clock.t);
            world.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          apply();
          tl.to(clock, { t: FILM, duration: FILM, ease: "none", onUpdate: apply }, 0);

          // White takes the frame as the camera passes through Mira.
          tl.fromTo("#f04-veil", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.in", immediateRender: false }, 5.75);

          window.__timelines["f04-modes"] = tl;
        })();
      </script>
