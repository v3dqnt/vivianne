<span class="css-1hs3ynv"><b>One door.</b> Mods talk to Vivianne only through the vivianne SDK, and every call is checked against the permissions you approved.</span><span class="css-1hs3ynv"><b>Your say.</b> Nothing runs until you approve its permissions. A mod that later asks for more stays off until you agree again. Project mods stay off until you trust that project.</span><span class="css-1hs3ynv"><b>Limits.</b> 10 MB per mod, 1 MB of saved data, 20 contributions, 100 calls a second. A mod that crashes only takes down its own panel.</span><span class="css-1hs3ynv"><b>Follows your theme.</b> Pages get the app's colours and fonts as --viv-* CSS variables, updated live.</span></div></div></div></div><div class="css-15seaq3"><div class="css-ov4fhy"><div class="css-po8mqt"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" color="currentColor" class="" stroke-width="1.75" stroke="currentColor"><path d="M8.64298 3.14559L6.93816 3.93362C4.31272 5.14719 3 5.75397 3 6.75C3 7.74603 4.31272 8.35281 6.93817 9.56638L8.64298 10.3544C10.2952 11.1181 11.1214 11.5 12 11.5C12.8786 11.5 13.7048 11.1181 15.357 10.3544L17.0618 9.56638C19.6873 8.35281 21 7.74603 21 6.75C21 5.75397 19.6873 5.14719 17.0618 3.93362L15.357 3.14559C13.7048 2.38186 12.8786 2 12 2C11.1214 2 10.2952 2.38186 8.64298 3.14559Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path><path d="M20.788 11.0972C20.9293 11.2959 21 11.5031 21 11.7309C21 12.7127 19.6873 13.3109 17.0618 14.5072L15.357 15.284C13.7048 16.0368 12.8786 16.4133 12 16.4133C11.1214 16.4133 10.2952 16.0368 8.64298 15.284L6.93817 14.5072C4.31272 13.3109 3 12.7127 3 11.7309C3 11.5031 3.07067 11.2959 3.212 11.0972" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path><path d="M20.3767 16.2661C20.7922 16.5971 21 16.927 21 17.3176C21 18.2995 19.6873 18.8976 17.0618 20.0939L15.357 20.8707C13.7048 21.6236 12.8786 22 12 22C11. 8 2.3459 9.71729 2.41317C9.32164 2.7167 9.10063 3.20155 8.65861 4.17126L8.05292 5.5" stroke="currentColor" stroke-linecap="round" stroke-width="1.75"></path><path d="M9.5 16.5L9.5 10.5" stroke="currentColor" stroke-linecap="round" stroke-width="1.75"></path><path d="M14.5 16.5L14.5 10.5" stroke="currentColor" stroke-linecap="round" stroke-width="1.75"></path></svg></button><button type="button" class="ui-Switch css-1x7uyq5" role="switch" aria-checked="true" data-state="checked" value="on"><span data-state="checked" class="ui-Switch-thumb"></span></button></div></div></div></div><hr data-orientation="horizontal" role="none" class="css-1huv01"><div class="css-1qs59fb"><h6 class="css-jut5ec">Performance</h6><div class="css-1hqghx4"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" color="currentColor" class="" stroke-width="1.75" stroke="currentColor" style="flex-shrink: 0;"><path d="M5.22576 11.3294L12.224 2.34651C12.7713 1.64397 13.7972 2.08124 13.7972 3.01707V9.96994C13.7972 10.5305 14.1995 10.985 14.6958 10.985H18.0996C18.8729 10.985 19.2851 12.0149 18.7742 12.6706L11.776 21.6535C11.2287 22.356 10.2028 21.9188 10.2028 20.9829V14.0301C10.2028 13.4695 9.80048 13.015 9.3042 13.015H5.90035C5.12711 13.015 4.71494 11.9851 5.22576 11.3294Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path></svg><div class="css-1vs2w7m"><p class="css-hjd0kl">Supercharge</p><span class="css-1d6tu9k">Closes the apps and background clients you don't need right now and gives Vivianne the machine: more memory and CPU for the AI, more bandwidth for the internet. Asks you first.</span></div><button type="button" class="ui-Switch css-1x7uyq5" role="switch" aria-checked="false" data-state="unchecked" value="on"><span data-state="unchecked" class="ui-Switch-thumb"></span></button></div></div><hr data-orientation="horizontal" role="none" class="css-1huv01"><div class="css-15seaq3"><h6 class="css-jut5ec">Guides</h6><span class="css-1lrubh7">How Vivianne designs documents and works on projects, from <a href="https://github.com/v3dqnt/vivianne-guides" target="_blank" rel="noreferrer" class="css-50369r">vivianne-guides</a>. Fork it with your own brand, templates and way of working, and paste your fork here. Leave empty for the default.</span><div class="css-h11xlh"><div class="ui-InputBase-root css-1r1u4oq"><input placeholder="https://github.com/v3dqnt/vivianne-guides" class="ui-InputBase-input" type="text" value=""></div><button class="ui-ButtonBase ui-Button css-hixojh" type="button">Save</button></div></div><hr data-orientation="horizontal" role="none" class="css-1huv01"><div class="css-1qs59fb"><h6 class="css-jut5ec">Built-in tools</h6><span class="css-1hpopjw">Disabled tools are hidden from the agent entirely — it won't see them in its toolset, and it can't call them.</span></div><hr data-orientation="horizontal" role="none" class="css-1huv01"><div class="css-11dekmq"><div class="css-1w24266"><div class="css-zpcxq1"><h6 class="css-jut5ec">Tools Vivianne made</h6><span class="css-1d6tu9k">Python tools written with create_tool when a task needed one. Every model you use gets them, in every project. Calls ask for approval like any code that runs.</span></div><button class="ui-ButtonBase ui-Button css-18q31wc" type="button" disabled="">Run shredder</button></div><span class="css-lfm481">None yet. Ask for something no tool does and Vivianne can write one, or say "make a tool that…".</span></div><hr data-orientation="horizontal" role="none" class="css-1huv01"><div class="css-1qs59fb"><h6 class="css-jut5ec">Scripting</h6><div class="css-1hqghx4"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" color="currentColor" class="" stroke-width="1.75" stroke="currentColor" style="flex-shrink: 0;"><path d="M5.22576 11.3294L12.224 2.34651C12.7713 1.64397 13.7972 2.08124 13.7972 3.01707V9.96994C13.7972 10.5305 14.1995 10.985 14.6958 10.985H18.0996C18.8729 10.985 19.2851 12.0149 18.7742 12.6706L11.776 21.6535C11.2287 22.356 10.2028 21.9188 10.2028 20.9829V14.0301C10.2028 13.4695 9.80048 13.015 9.3042 13.015H5.90035C5.12711 13.015 4.71494 11.9851 5.22576 11.3294Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path></svg><div class="css-1vs2w7m"><p class="css-1eu1s9w">Programmatic tool calling</p><span class="css-1d6tu9k">Lets the agent write a short script (run_script) that calls any of its tools — built-in, MCP or playbook — in one turn instead of one round-trip each. Every call still goes through the usual approvals.</span></div><button type="button" class="ui-Switch css-1x7uyq5" role="switch" aria-checked="true" data-state="checked" value="on"><span data-state="checked" class="ui-Switch-thumb"></span></button></div></div></div></div></div></div></div></div></div><span data-radix-focus-guard="" tabindex="0" data-aria-hidden="true" aria-hidden="true" style="outline: none; opacity: 0; position: fixed; pointer-events: none;"></span></div></div><div class="ap-state" data-state="b4"><div class="vapp"><div class="css-n5gqzs"><div data-tauri-drag-region="" class="css-16p71ry" data-aria-hidden="true" aria-hidden="true"><div class="traffic-lights css-1bv4y5d"><button title="Close" class="css-1pr4b5g"><svg class="traffic-light-glyph css-dsb5un" viewBox="0 0 6 6"><path d="M1.2 1.2 L4.8 4.8 M4.8 1.2 L1.2 4.8"></path></svg></button><button title="Minimize" class="css-vbw53o"><svg class="traffic-light-glyph css-9pgoqk" viewBox="0 0 6 6"><path d="M1 3 H5"></path></svg></button><button title="Maximize" class="css-ohdx4n"><svg class="traffic-light-glyph css-1a25bn5" viewBox="0 0 6 6"><path d="M1 5 L5 1 M1.2 2.5 V1.2 H2.5 M4.8 3.5 V4.8 H3.5"></path></svg></button><button class="ui-ButtonBase ui-IconButton css-qitzt7" type="button" aria-label="Hide sidebar" aria-pressed="true" data-state="closed"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" span><span class="css-1hs3ynv"><b>Limits.</b> 10 MB per mod, 1 MB of saved data, 20 contributions, 100 calls a second. A mod that crashes only takes down its own panel.</span><span class="css-1hs3ynv"><b>Follows your theme.</b> Pages get the app's colours and fonts as --viv-* CSS variables, updated live.</span></div></div></div></div><div class="css-15seaq3"><div class="css-ov4fhy"><div class="css-po8mqt"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" color="currentColor" class="" stroke-width="1.75" stroke="currentColor"><path d="M8.64298 3.14559L6.93816 3.93362C4.31272 5.14719 3 5.75397 3 6.75C3 7.74603 4.31272 8.35281 6.93817 9.56638L8.64298 10.3544C10.2952 11.1181 11.1214 11.5 12 11.5C12.8786 11.5 13.7048 11.1181 15.357 10.3544L17.0618 9.56638C19.6873 8.35281 21 7.74603 21 6.75C21 5.75397 19.6873 5.14719 17.0618 3.93362L15.357 3.14559C13.7048 2.38186 12.8786 2 12 2C11.1214 2 10.2952 2.38186 8.64298 3.14559Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path><path d="M20.788 11.0972C20.9293 11.2959 21 11.5031 21 11.7309C21 12.7127 19.6873 13.3109 17.0618 14.5072L15.357 15.284C13.7048 16.0368 12.8786 16.4133 12 16.4133C11.1214 16.4133 10.2952 16.0368 8.64298 15.284L6.93817 14.5072C4.31272 13.3109 3 12.7127 3 11.7309C3 11.5031 3.07067 11.2959 3.212 11.0972" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path><path d="M20.3767 16.2661C20.7922 16.5971 21 16.927 21 17.3176C21 18.2995 19.6873 18.8976 17.0618 20.0939L15.357 20.8707C13.7048 21.6236 12.8786 22 12 22C11.1214 22 10.2952 21.6236 8.64298 20.8707L6.93817 20.0939C4.31272 18.8976 3 18.2995 3 17.3176C3 16.927 3.20778 16.5971 3.62334 16.2661" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path></svg></div><div class="css-11khryo"><div class="css-1um2c7m"><p class="css-hjd0kl">Agent board</p><span class="css-1d6tu9k">1.0.0</span><div cl n><button type="button" class="ui-Switch css-1x7uyq5" role="switch" aria-checked="true" data-state="checked" value="on"><span data-state="checked" class="ui-Switch-thumb"></span></button></div></div></div></div><hr data-orientation="horizontal" role="none" class="css-1huv01"><div class="css-1qs59fb"><h6 class="css-jut5ec">Performance</h6><div class="css-1hqghx4"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" color="currentColor" class="" stroke-width="1.75" stroke="currentColor" style="flex-shrink: 0;"><path d="M5.22576 11.3294L12.224 2.34651C12.7713 1.64397 13.7972 2.08124 13.7972 3.01707V9.96994C13.7972 10.5305 14.1995 10.985 14.6958 10.985H18.0996C18.8729 10.985 19.2851 12.0149 18.7742 12.6706L11.776 21.6535C11.2287 22.356 10.2028 21.9188 10.2028 20.9829V14.0301C10.2028 13.4695 9.80048 13.015 9.3042 13.015H5.90035C5.12711 13.015 4.71494 11.9851 5.22576 11.3294Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path></svg><div class="css-1vs2w7m"><p class="css-hjd0kl">Supercharge</p><span class="css-1d6tu9k">Closes the apps and background clients you don't need right now and gives Vivianne the machine: more memory and CPU for the AI, more bandwidth for the internet. Asks you first.</span></div><button type="button" class="ui-Switch css-1x7uyq5" role="switch" aria-checked="false" data-state="unchecked" value="on"><span data-state="unchecked" class="ui-Switch-thumb"></span></button></div></div><hr data-orientation="horizontal" role="none" class="css-1huv01"><div class="css-15seaq3"><h6 class="css-jut5ec">Guides</h6><span class="css-1lrubh7">How Vivianne designs documents and works on projects, from <a href="https://github.com/v3dqnt/vivianne-guides" target="_blank" rel="noreferrer" class="css-50369r">vivianne-guides</a>. Fork it with your own brand, templates and way of working, and paste your fork here. Leave empty for the default.</span><div class="css-h11xlh"><div class="ui-InputBase-root css-1r1u4oq"><input placeholder="https://github.com/v3dqnt/vivianne-guides" class="ui-InputBase-input" type="text" value=""></div><button class="ui-ButtonBase ui-Button css-hixojh" type="button">Save</button></div></div><hr data-orientation="horizontal" role="none" class="css-1huv01"><div class="css-1qs59fb"><h6 class="css-jut5ec">Built-in tools</h6><span class="css-1hpopjw">Disabled tools are hidden from the agent entirely — it won't see them in its toolset, and it can't call them.</span></div><hr data-orientation="horizontal" role="none" class="css-1huv01"><div class="css-11dekmq"><div class="css-1w24266"><div class="css-zpcxq1"><h6 class="css-jut5ec">Tools Vivianne made</h6><span class="css-1d6tu9k">Python tools written with create_tool when a task needed one. Every model you use gets them, in every project. Calls ask for approval like any code that runs.</span></div><button class="ui-ButtonBase ui-Button css-18q31wc" type="button" disabled="">Run shredder</button></div><span class="css-lfm481">None yet. Ask for something no tool does and Vivianne can write one, or say "make a tool that…".</span></div><hr data-orientation="horizontal" role="none" class="css-1huv01"><div class="css-1qs59fb"><h6 class="css-jut5ec">Scripting</h6><div class="css-1hqghx4"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" color="currentColor" class="" stroke-width="1.75" stroke="currentColor" style="flex-shrink: 0;"><path d="M5.22576 11.3294L12.224 2.34651C12.7713 1.64397 13.7972 2.08124 13.7972 3.01707V9.96994C13.7972 10.5305 14.1995 10.985 14.6958 10.985H18.0996C18.8729 10.985 19.2851 12.0149 18.7742 12.6706L11.776 21.6535C11.2287 22.356 10.2028 21.9188 10.2028 20.9829V14.0301C10.2028 13.4695 9.80048 13.015 9.3042 13.015H5.90035C5.12711 13.015 4.71494 11.9851 5.22576 11.3294Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path></svg><div class="css-1vs2w7m"><p class="css-1eu1s9w">Programmatic tool calling</p><span class="css-1d6tu9k">Lets the agent write a short script (run_script) that calls any of its tools — built-in, MCP or playbook — in one turn instead of one round-trip each. Every call still goes through the usual approvals.</span></div><button type="button" class="ui-Switch css-1x7uyq5" role="switch" aria-checked="true" data-state="checked" value="on"><span data-state="checked" class="ui-Switch-thumb"></span></button></div></div></div></div></div></div></div></div></div><div class="ui-Dialog-container css-12la7g1" data-state="open" style="pointer-events: auto;"><div tabindex="-1" class="ui-Dialog-paper css-8atwtl" role="dialog" data-state="open" style="pointer-events: auto;"><h2 class="ui-DialogTitle css-1gem7aw">Turn on Agent board?</h2><div class="ui-DialogContent css-lrnjt5"><div class="css-11dekmq"><p class="css-2r392c">Every agent at work, live</p><p class="css-hjd0kl">It will be able to:</p><p class="css-1upjq5f">• See what your agents are doing</p><span class="css-1d6tu9k">It runs sandboxed and can do nothing beyond this. If it later asks for more, it stays off until you agree again.</span></div></div><div class="ui-DialogActions css-lz558y"><button class="ui-ButtonBase ui-Button css-6eclzu" type="button">Not now</button><button class="ui-ButtonBase ui-Button css-v0xrld" type="button">Turn on</button></div></div></div><span data-radix-focus-guard="" tabindex="0" data-aria-hidden="true" aria-hidden="true" style="outline: none; opacity: 0; position: fixed; pointer-events: none;"></span></div></div><div class="ap-state" data-state="b3"><div class="vapp"><div class="css-n5gqzs"><div data-tauri-drag-region="" class="css-16p71ry"><div class="traffic-lights css-1bv4y5d"><button title="Close" class="css-1pr4b5g"><svg class="traffic-light-glyph css-dsb5un" viewBox="0 0 6 6"><path d="M1.2 1.2 L4.8 4.8 M4.8 1.2 L1.2 4.8"></path></svg></button><button title="Minimize" class="css-vbw53o"><svg class="traffic-light-glyph css-9pgoqk" viewBox=         <audio id="f08-sfx-s1" data-hf-media-start-basis="local" src="assets/sfx/click-soft.mp3" data-start="0.95" data-duration="0.37" data-track-index="121" data-volume="0.25"></audio>
        <audio id="f08-sfx-s2" data-hf-media-start-basis="local" src="assets/sfx/click-soft.mp3" data-start="1.2" data-duration="0.37" data-track-index="122" data-volume="0.25"></audio>
        <audio id="f08-sfx-s3" data-hf-media-start-basis="local" src="assets/sfx/click-soft.mp3" data-start="1.45" data-duration="0.37" data-track-index="123" data-volume="0.25"></audio>
        <audio id="f08-sfx-set" data-hf-media-start-basis="local" src="assets/sfx/pop.mp3" data-start="2.45" data-duration="0.5" data-track-index="124" data-volume="0.3"></audio>
        <audio id="f08-sfx-sw" data-hf-media-start-basis="local" src="assets/sfx/click.mp3" data-start="3.35" data-duration="0.37" data-track-index="125" data-volume="0.5"></audio>
        <audio id="f08-sfx-dlg" data-hf-media-start-basis="local" src="assets/sfx/notification.mp3" data-start="3.45" data-duration="1.2" data-track-index="126" data-volume="0.3"></audio>
        <audio id="f08-sfx-on" data-hf-media-start-basis="local" src="assets/sfx/click.mp3" data-start="4.2" data-duration="0.37" data-track-index="127" data-volume="0.55"></audio>
        <audio id="f08-sfx-panel" data-hf-media-start-basis="local" src="assets/sfx/whoosh-short.mp3" data-start="4.45" data-duration="0.57" data-track-index="128" data-volume="0.45"></audio>
        <audio id="f08-sfx-cards" data-hf-media-start-basis="local" src="assets/sfx/sparkle.mp3" data-start="4.7" data-duration="1.8" data-track-index="129" data-volume="0.25"></audio>
        <audio id="f08-sfx-check" data-hf-media-start-basis="local" src="assets/sfx/pop.mp3" data-start="5.95" data-duration="0.5" data-track-index="130" data-volume="0.3"></audio>
        <audio id="f08-sfx-hit" data-hf-media-start-basis="local" src="assets/sfx/impact-bass-1.mp3" data-start="6.9" data-duration="1.4" data-track-index="131" data-volume="0.35"></audio>
      </div>

      <script>
        (function () {
          const FILM = 8.4;
          const tl = gsap.timeline({ paused: true });
          const root = document.getElementById("f08-root");
          const space = document.getElementById("f08-space");
          const screen = document.getElementById("f08-screen");
          const st = (k) => [...root.querySelectorAll(".ap-state")].find((e) => e.dataset.state === k);

          // The outermost element whose text is exactly the smallest match of
          // `re` inside `scope`: a whole row, card or bubble, found by its words.
          const box = (scope, re) => {
            const hits = [...scope.querySelectorAll("*")].filter((e) => re.test(e.textContent || ""));
            if (!hits.length) return null;
            let el = hits.sort((a, b) => a.textContent.length - b.textContent.length)[0];
            const text = el.textContent.trim();
            while (el.parentElement && el.parentElement !== scope && el.parentElement.textContent.trim() === text) el = el.parentElement;
            return el;
          };
          // Rects in the screen's own (unscaled-on-screen) pixels, measured flat.
          space.style.transform = "none";
          const S0 = screen.getBoundingClientRect();
          const at = (el) => {
            const r = el.getBoundingClientRect();
            return { x: r.left - S0.left, y: r.top - S0.top, w: r.width, h: r.height, cx: r.left - S0.left + r.width / 2, cy: r.top - S0.top + r.height / 2 };
          };

          const b1 = st("b1");
          const b2 = st("b2");
          const b4 = st("b4");
          const b3 = st("b3");
          const ask = box(b1, /^Build me a panel that shows every agent at work$/);
          const steps = [/^guide$/, /^Wrotemod\.json$/, /^Wrotepanel\.html$/].map((re) => box(b1, re));
          const reply = box(b1, /^The Agent board is built/);
          // The Agent board's switch: the first in the list, above the Checklist's.
          const SWITCH = at(b2.querySelector('[role="switch"]'));
          const dlg = box(b4, /^Turn on Agent board\?/);
          const dlgPaper = dlg ? dlg.closest('[role="dialog"]') || dlg.parentElement : null;
          const turnOn = [...b4.querySelectorAll("button")].find((b) => (b.textContent || "").trim() === "Turn on");
          const TURNON = at(turnOn);
          const flips = [...b3.querySelectorAll(".viv-flip")];
          const boardEl = flips.find((f) => at(f).x > 900);
          const checkEl = flips.find((f) => f !== boardEl);
          const BOARD = at(boardEl);
          const CHECK = at(checkEl);
          const tab = box(b3, /^Agent board$/);
          const q2 = box(b3, /^What's left before the release\?$/);
          space.style.transform = "";

          // ── 1. The ask, the steps, the reply: the chat builds as it happened.
          tl.set(b1, { opacity: 1 }, 0);
          const rise = (el, t, d = 0.45) => {
            if (!el) return;
            gsap.set(el, { opacity: 0, y: 18 });
            tl.to(el, { opacity: 1, y: 0, duration: d, ease: "expo.out" }, t);
          };
          rise(ask, 0.35);
          steps.forEach((el, i) => rise(el, 0.95 + i * 0.25));
          rise(reply, 1.75, 0.6);

          // ── 2. Settings → Mods opens; the cursor turns the new mod on.
          const cur = "#f08-cur";
          const TIP = 6;
          const move = (p, t, d) => tl.to(cur, { x: p.cx - TIP, y: p.cy - TIP, duration: d, ease: "power3.inOut" }, t);
          const press = (p, t, rip, target) => {
            tl.to([cur].concat(target ? [target] : []), { scale: 0.86, duration: 0.07, ease: "power2.in" }, t);
            tl.to([cur].concat(target ? [target] : []), { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t + 0.07);
            tl.set(rip, { x: p.cx, y: p.cy }, t);
            tl.fromTo(rip, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.6, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.04);
          };
          tl.to(b2, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.4);
          const settingsCard = box(b2, /^SettingsACCOUNT/i) || null;
          if (settingsCard) tl.fromTo(settingsCard, { scale: 0.95, y: 24 }, { scale: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, 2.4);
          gsap.set(cur, { x: SWITCH.cx + 180, y: SWITCH.cy + 260 });
          tl.to(cur, { opacity: 1, duration: 0.2 }, 2.6);
          move(SWITCH, 2.65, 0.65);
          press(SWITCH, 3.35, "#f08-rip-1");
          // It asks first: the real consent dialog.
          tl.set(b4, { opacity: 1 }, 3.42);
          tl.set(b2, { opacity: 0 }, 3.42);
          if (dlgPaper) tl.fromTo(dlgPaper, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)", immediateRender: false }, 3.42);
          move(TURNON, 3.6, 0.55);
          press(TURNON, 4.2, "#f08-rip-2", turnOn);

          // ── 3. On: the Agent board slides into the dock, its cards live;
          // later a checklist the Checklist mod draws lands in the chat.
          tl.to(b4, { opacity: 0, duration: 0.25, ease: "power2.in" }, 4.35);
          tl.to(b3, { opacity: 1, duration: 0.25, ease: "power2.out" }, 4.35);
          tl.to(cur, { opacity: 0, duration: 0.2 }, 4.4);
          if (tab) tl.fromTo(tab, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, 4.45);
          if (boardEl) tl.fromTo(boardEl, { x: 140, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out", immediateRender: false }, 4.5);
          rise(q2, 5.55);
          if (checkEl) tl.fromTo(checkEl, { scale: 0.85, y: 30, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.6)", immediateRender: false }, 5.9);
          rise(box(b3, /^Three things, one done:$/), 5.8);

          // ── Headlines.
          const pop = (sel, t, out) => {
            const ws = [...root.querySelectorAll(sel + " .f08-w")];
            gsap.set(ws, { yPercent: 120, scale: 0.86, opacity: 0, filter: "blur(10px)" });
            tl.to(ws, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "back.out(1.7)", stagger: 0.05 }, t);
            if (out) tl.to(ws, { opacity: 0, yPercent: -60, filter: "blur(8px)", duration: 0.3, ease: "power2.in", stagger: 0.02 }, out);
          };
          pop("#f08-h1", 0.2, 2.35);
          pop("#f08-h2", 2.6, 4.45);
          pop("#f08-h3", 6.4);
          tl.fromTo("#f08-sub", { opacity: 0, y: 16, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: false }, 6.8);

          // ── Camera: [t, focusX, focusY, z, rx, ry], focus in the space's
          // pixels, shown at y 600, under the headlines. Arrives from below-left,
          // leans into the chat, the switch, the dialog, follows the board into
          // the dock and the checklist, then settles back for the title.
          const SX = 269;
          const SY = 236;
          const P = (r, dx = 0, dy = 0) => [SX + r.cx + dx, SY + r.cy + dy];
          const KEYS = [
            [0.0, 960, 700, -700, 10, -10],
            [1.0, 930, 520, 260, 3, -2],
            [2.2, 930, 500, 420, 1, 0],
            [2.6, 960, 600, 120, 0, 0],
            [3.2, ...P(SWITCH, -90, 40), 300, 0, 2],
            [3.9, ...P(TURNON, -110, -10), 320, 0, 0],
            [4.6, 1120, 580, 100, 0, -3],
            [5.4, SX + BOARD.cx - 40, SY + BOARD.y + 150, 300, 0, -4],
            [6.2, ...P(CHECK, 40, -20), 300, 0, 3],
            [7.0, 960, 640, -80, 1, 0],
            [8.4, 960, 630, -140, 2, 0],
          ];
          const C = KEYS[0].length - 1;
          const slopes = [];
          for (let c = 1; c <= C; c++) {
            const n = KEYS.length;
            const d = [];
            for (let i = 0; i < n - 1; i++) d.push((KEYS[i + 1][c] - KEYS[i][c]) / (KEYS[i + 1][0] - KEYS[i][0]));
            const m = new Array(n).fill(0);
            for (let i = 1; i < n - 1; i++) {
              if (d[i - 1] * d[i] > 0) {
                const h0 = KEYS[i][0] - KEYS[i - 1][0];
                const h1 = KEYS[i + 1][0] - KEYS[i][0];
                const w1 = 2 * h1 + h0;
                const w2 = h1 + 2 * h0;
                m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
              }
            }
            slopes.push(m);
          }
          const camAt = (t) => {
            if (t <= KEYS[0][0]) return KEYS[0].slice(1);
            const last = KEYS[KEYS.length - 1];
            if (t >= last[0]) return last.slice(1);
            let i = 0;
            while (t > KEYS[i + 1][0]) i++;
            const h = KEYS[i + 1][0] - KEYS[i][0];
            const u = (t - KEYS[i][0]) / h;
            const h00 = 2 * u ** 3 - 3 * u ** 2 + 1;
            const h10 = u ** 3 - 2 * u ** 2 + u;
            const h01 = -2 * u ** 3 + 3 * u ** 2;
            const h11 = u ** 3 - u ** 2;
            const v = [];
            for (let c = 1; c <= C; c++) v.push(h00 * KEYS[i][c] + h10 * h * slopes[c - 1][i] + h01 * KEYS[i + 1][c] + h11 * h * slopes[c - 1][i + 1]);
            return v;
          };
          const clock = { t: 0 };
          const apply = () => {
            const [fx, fy, z, rx, ry] = camAt(clock.t);
            space.style.transform = `translate3d(${960 - fx}px, ${540 + 60 - fy}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          };
          apply();
          tl.to(clock, { t: FILM, duration: FILM, ease: "none", onUpdate: apply }, 0);
          tl.to(["#f08-stage", "#f08-veil", "#f08-heads", "#f08-sub"], { opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power2.in" }, 8.1);

          window.__timelines["f08-mods"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
