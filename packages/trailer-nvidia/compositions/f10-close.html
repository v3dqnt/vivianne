<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Sora";
          src: url("assets/fonts/Sora-Variable.ttf") format("truetype");
          font-weight: 100 800;
        }
        #f10-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #ffffff;
          font-family: "Sora", system-ui, sans-serif;
          color: #111111;
        }
        #f10-stage {
          position: absolute;
          inset: 0;
          perspective: 1200px;
        }
        #f10-cam {
          position: absolute;
          inset: 0;
          transform-style: preserve-3d;
        }
        /* Everything seen so far, flying home into the mark. */
        .f10-panel {
          position: absolute;
          left: 0;
          top: 0;
          width: 720px;
          height: 405px;
          margin: -202px 0 0 -360px;
          border-radius: 16px;
          overflow: hidden;
          background: #ffffff;
          box-shadow: 0 0 0 1px rgba(17, 17, 17, 0.08), 0 30px 70px rgba(17, 17, 17, 0.16);
        }
        .f10-panel img {
          width: 100%;
          height: 100%;
          display: block;
          object-fit: cover;
          object-position: top left;
        }
        .f10-panel.notch {
          width: 520px;
          height: 190px;
          margin: -95px 0 0 -260px;
          background: transparent;
          box-shadow: none;
          border-radius: 0;
        }
        #f10-glow {
          position: absolute;
          left: 660px;
          top: 200px;
          width: 600px;
          height: 600px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(118, 185, 0, 0.24) 0%, rgba(79, 143, 224, 0.12) 38%, rgba(255, 255, 255, 0) 70%);
          opacity: 0;
        }
        #f10-lockup {
          position: absolute;
          left: 0;
          right: 0;
          top: 360px;
          height: 280px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 40px;
          transform-style: preserve-3d;
        }
        #f10-mark {
          width: 230px;
          height: 230px;
          flex: none;
          --a: 0deg;
          -webkit-mask-image: conic-gradient(from 200deg, #000 var(--a), transparent var(--a));
          mask-image: conic-gradient(from 200deg, #000 var(--a), transparent var(--a));
        }
        #f10-mark img {
          width: 100%;
          height: 100%;
          display: block;
        }
        #f10-word {
          display: flex;
          font-size: 150px;
          font-weight: 500;
          letter-spacing: -0.05em;
          line-height: 1;
          transform-style: preserve-3d;
        }
        .f10-l {
          display: inline-block;
          transform-origin: 50% 80%;
        }
        #f10-credit {
          position: absolute;
          left: 0;
          right: 0;
          top: 700px;
          text-align: center;
          font-size: 38px;
          letter-spacing: -0.02em;
          color: #6b6b6b;
        }
        #f10-credit b {
          font-weight: 500;
          color: #111111;
        }
        .f10-w {
          display: inline-block;
        }
        #f10-credit b.f10-grad {
          color: transparent;
        }
        .f10-grad {
          background-image: linear-gradient(100deg, #4a7400 0%, #4a7400 35%, #9be22e 50%, #4a7400 65%, #4a7400 100%);
          background-size: 250% 100%;
          background-position: 100% 0;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
      </style>

      <div id="f10-root" data-composition-id="f10-close" data-width="1920" data-height="1080">
        <div id="f10-glow"></div>
        <div id="f10-stage">
          <div id="f10-cam">
            <div class="f10-panel" id="f10-p1"><img src="assets/close/e1.jpg" alt="" /></div>
            <div class="f10-panel" id="f10-p2"><img src="assets/close/w2.jpg" alt="" /></div>
            <div class="f10-panel" id="f10-p3"><img src="assets/close/m5.jpg" alt="" /></div>
            <div class="f10-panel" id="f10-p4"><img src="assets/close/u1.jpg" alt="" /></div>
            <div class="f10-panel" id="f10-p5"><img src="assets/close/c3.jpg" alt="" /></div>
            <div class="f10-panel" id="f10-p6"><img src="assets/close/a2.jpg" alt="" /></div>
            <div class="f10-panel notch" id="f10-p7"><img src="assets/close/notch.png" alt="" /></div>
            <div id="f10-lockup">
              <div id="f10-mark"><img src="assets/brand/vivianne-logo.png" alt="Vivianne" /></div>
              <div id="f10-word"><span class="f10-l">V</span><span class="f10-l">i</span><span class="f10-l">v</span><span class="f10-l">i</span><span class="f10-l">a</span><span class="f10-l">n</span><span class="f10-l">n</span><span class="f10-l">e</span></div>
            </div>
          </div>
        </div>
        <div id="f10-credit"><span class="f10-w">Built</span> <span class="f10-w">on</span> <span class="f10-w"><b>NVIDIA</b></span> <span class="f10-w"><b class="f10-grad">Nemotron</b></span> <span class="f10-w">·</span> <span class="f10-w"><b>Nebius</b></span> <span class="f10-w"><b>Token</b></span> <span class="f10-w"><b>Factory</b></span></div>

        <audio id="f10-sfx-in" data-hf-media-start-basis="local" src="assets/sfx/whoosh-cinematic.mp3" data-start="0" data-duration="1.6" data-track-index="140" data-volume="0.4"></audio>
        <audio id="f10-sfx-glow" data-hf-media-start-basis="local" src="assets/sfx/aurora.mp3" data-start="0.6" data-duration="4.9" data-track-index="141" data-volume="0.55"></audio>
        <audio id="f10-sfx-hit" data-hf-media-start-basis="local" src="assets/sfx/impact-bass-1.mp3" data-start="1.45" data-duration="2.12" data-track-index="142" data-volume="0.55"></audio>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const letters = [...document.querySelectorAll("#f10-word .f10-l")];
          // The mark sits centred before the name makes room; panels fly to it.
          const MARK = { x: 960, y: 500 };

          // ── Every scene's surface, scattered in depth, converging on the mark.
          const START = [
            [380, 260, -300, 18, -24, -6],
            [1560, 250, -500, 14, 22, 5],
            [300, 820, -700, -12, -18, 4],
            [1600, 840, -400, -16, 26, -5],
            [960, 160, -1100, 24, 0, 2],
            [960, 930, -900, -20, 0, -3],
            [1480, 560, -200, 0, 18, 0],
          ];
          START.forEach(([x, y, z, rx, ry, rz], i) => {
            const id = "#f10-p" + (i + 1);
            tl.fromTo(id, { x, y, z, rotationX: rx, rotationY: ry, rotation: rz, scale: 1, opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out", immediateRender: true }, 0);
            tl.to(id, { x: MARK.x, y: MARK.y, z: 0, rotationX: 0, rotationY: 0, rotation: 0, scale: 0.05, duration: 1.25, ease: "power3.inOut" }, 0.1 + i * 0.03);
            tl.to(id, { opacity: 0, duration: 0.2, ease: "power1.in" }, 1.18 + i * 0.03);
          });

          // ── The mark is born where they land; then the name, then the credit.
          gsap.set("#f10-mark", { x: 345 });
          tl.fromTo("#f10-glow", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.2, duration: 1.0, ease: "power2.out", immediateRender: false }, 1.3);
          tl.to("#f10-glow", { opacity: 0.4, scale: 1.5, duration: 2.5, ease: "power1.inOut" }, 2.3);
          tl.fromTo("#f10-mark", { scale: 0.2, opacity: 0, "--a": "360deg" }, { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.8)", immediateRender: true }, 1.35);
          tl.fromTo("#f10-mark", { "--a": "0deg" }, { "--a": "360deg", duration: 0.9, ease: "power3.inOut", immediateRender: false }, 1.4);
          tl.to("#f10-mark", { x: 0, duration: 0.75, ease: "power3.inOut" }, 2.0);
          gsap.set(letters, { opacity: 0, z: -420, rotationX: -80, y: 60, filter: "blur(10px)" });
          tl.to(letters, { opacity: 1, z: 0, rotationX: 0, y: 0, filter: "blur(0px)", duration: 0.85, ease: "back.out(1.5)", stagger: 0.05 }, 2.2);
          const cw = [...document.querySelectorAll("#f10-credit .f10-w")];
          gsap.set(cw, { yPercent: 120, opacity: 0, filter: "blur(8px)" });
          tl.to(cw, { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "back.out(1.6)", stagger: 0.06 }, 3.0);
          tl.fromTo("#f10-credit b.f10-grad", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.4, ease: "power2.inOut", immediateRender: false }, 3.4);

          // ── Camera: a slow orbit that settles, still moving at the end.
          tl.fromTo("#f10-cam", { rotationY: -16, rotationX: 6, z: -200 }, { rotationY: 6, rotationX: -1, z: 40, duration: 5.6, ease: "power2.out" }, 0);

          window.__timelines["f10-close"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
