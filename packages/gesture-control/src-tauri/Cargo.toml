[package]
name = "gesture-control"
version = "0.1.0"
description = "Standalone hand-gesture control of the Windows desktop"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gesture_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tokio = { version = "1.0", features = ["rt", "process", "io-util", "sync"] }
enigo = "0.6"
xcap = "0.9"

[dev-dependencies]
