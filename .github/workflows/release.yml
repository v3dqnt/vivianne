# Builds, signs, and publishes a release the in-app updater can consume.
#
# The app's updater reads
# `github.com/v3dqnt/vivianne-releases/releases/latest/download/latest.json`.
# The code repo is private, and a private repo's release files 404 for every
# installed app (they have no GitHub login), so releases are published to the
# public `vivianne-releases` repo, which holds only installers and that
# manifest. This workflow builds, signs and publishes them there.
#
# Trigger: push a version tag.
#   npm version patch -ws --no-git-tag-version   # or edit versions by hand
#   git commit -am "Release v1.7.3" && git tag v1.7.3 && git push --follow-tags
#
# Required secrets on THIS repo (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY — the minisign private key whose public half is
#       tauri.conf.json's `plugins.updater.pubkey` (the key file lives at
#       ~/.tauri/vivianne-updater.key on the maintainer's machine; no password).
#       An update signed by any other key is rejected by every client — that
#       check is the point of the signature, so a mismatch fails closed.
#   RELEASES_TOKEN — a fine-grained personal access token with Contents:
#       read and write on v3dqnt/vivianne-releases. The automatic
#       GITHUB_TOKEN can only write to the repo the workflow runs in.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build and verify without publishing, so the pipeline can be
  # exercised before committing to a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Windows and macOS. tauri-action merges every matrix job's artifacts into
    # one latest.json, so the in-app updater serves the right installer per
    # host from a single manifest.
    #
    # macOS builds a universal binary: Apple silicon is the majority of Macs
    # now, but an x86_64-only or arm64-only build simply will not launch on the
    # other half, and the updater has one download per platform to offer.
    # Both architectures need their Rust std, hence the explicit targets.
    #
    # DIP's structured mode is UI Automation on Windows and the Accessibility
    # API on macOS (`coding_agent::dip_mac`); the schema advertises both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust-targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # whisper-rs-sys builds whisper.cpp through CMake and runs bindgen. The
      # macOS runner has clang and cmake, but src-tauri/.cargo/config.toml
      # pins Windows paths in its `[env]` table, which Cargo applies on every
      # host. Those entries do not force, so exporting correct values here
      # wins — the same mechanism packages/gui/scripts/dev-env.mjs uses for
      # local macOS builds.
      - name: Prepare macOS build environment
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ninja
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "CMAKE=$(which cmake)" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          # Vivianne supports macOS 10.15+; C dependencies follow this.
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      # Keyed on the lockfile so a dependency change busts it, and scoped to
      # the tauri crate's own target dir.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/gui/src-tauri -> target
          # Without this both matrix jobs write the same cache key and race,
          # and the restored artifacts are for the wrong host.
          key: ${{ matrix.platform }}

      - name: Install dependencies
        run: npm ci

      # Fail before the (slow) Rust build if the frontend is broken.
      - name: Typecheck frontend
        run: npx tsc -b --noEmit
        working-directory: packages/gui-next

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/gui
          # Published to the public releases repo (see the top of this file).
          owner: v3dqnt
          repo: vivianne-releases
          # The tag is created there, on its own main branch: this repo's
          # commit doesn't exist in that one.
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: 'Vivianne ${{ github.ref_name }}'
          # Pulled from CHANGELOG.md rather than retyped — the app's own
          # "what's new" dialog reads that same file, so a release whose notes
          # were written separately would disagree with what users are shown.
          releaseBody: 'See CHANGELOG.md for the full notes.'
          # Published immediately: a draft release does not serve
          # `releases/latest/download/latest.json`, so leaving this true means
          # the updater keeps 404ing exactly as it does today.
          releaseDraft: false
          prerelease: false
          # The manifest the updater actually fetches. Without this, the
          # release contains installers but nothing telling clients they exist.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
